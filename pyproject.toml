[project]
name = "interaction-gym"
version = "0.1.0"
description = "Closed-loop environments for training and evaluating full-duplex spoken agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/interaction_gym/benchmarks/third_party/**/LICENSE*"]
authors = [{ name = "Yinhong Liu", email = "williamliuyinhong@gmail.com" }]
keywords = ["full-duplex", "spoken dialogue", "reinforcement learning", "environment", "speech", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# agents.vllm_omni: full-duplex models served by vLLM-Omni (WebSocket client)
vllm-omni = ["websockets>=13.0"]
# Sierra's tau2-bench (MIT; NOT the unrelated "tau2" on PyPI), pinned below. Its domain data is read from a
# checkout (third_party/tau2-bench or $TAU2_DATA_DIR), see README.
tau = ["tau2", "websockets>=13.0"]  # tau2 imports its voice providers at import time
# Zapier's AutomationBench (MIT): clone it into third_party/automationbench, see README. Not a uv dependency:
# it declares Python >= 3.13, but the simulator, tasks and rubric we use run on 3.12 with just pydantic.
automationbench = ["pydantic>=2"]
# Full-Duplex-Bench metric rules, prompts, mock APIs and tool schemas (benchmarks.full_duplex_bench / fdb2 / fdb3):
# a separate distribution under CC BY-NC 4.0 (non-commercial only), extras/fdbench; NOT part of this Apache-2.0 package
fdbench = ["interaction-gym-fdbench"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "interaction-gym-fdbench"]  # the tests cover the FD-Bench loaders too

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_gym"]

[tool.hatch.build.targets.sdist]
exclude = ["extras/"]  # the CC BY-NC FD-Bench component is distributed separately (extras/fdbench)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "5bfa7e37b36656b37dc6d022156be6563c1007f3" }
interaction-gym-fdbench = { path = "extras/fdbench", editable = true }
