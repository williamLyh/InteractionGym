[project]
name = "interaction-gym-fdbench"
version = "0.1.0"
description = "Full-Duplex-Bench metric rules, mock APIs and prompts for InteractionGym (optional component; CC BY-NC 4.0, non-commercial only)"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yinhong Liu", email = "williamliuyinhong@gmail.com" }]
keywords = ["full-duplex", "spoken dialogue", "benchmark", "Full-Duplex-Bench"]
classifiers = [
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_gym_fdbench"]
