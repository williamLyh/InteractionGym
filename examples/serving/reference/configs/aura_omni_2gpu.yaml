# AURA duplex on two 32 GB cards: AURA (8B Qwen3-VL) alone on card 1; ASR + the two TTS stages on card 0. Local weights; the models / vllm_omni placeholders are filled in by the launcher (common.sh render).
base_config: @VLLM_OMNI_DIR@/deploy/aura_omni.yaml
stages:
  - stage_id: 0
    devices: "0"
    gpu_memory_utilization: 0.25
    model: @MODELS_DIR@/Qwen3-ASR-1.7B
  - stage_id: 1
    devices: "1"
    gpu_memory_utilization: 0.88
    max_model_len: 32768
    model: @MODELS_DIR@/AURA
  - stage_id: 2
    devices: "0"
    gpu_memory_utilization: 0.3
    model: @MODELS_DIR@/Qwen3-TTS-12Hz-1.7B-CustomVoice
  - stage_id: 3
    devices: "0"
    gpu_memory_utilization: 0.3
    model: @MODELS_DIR@/Qwen3-TTS-12Hz-1.7B-CustomVoice
