<style>
:root {

  --user: #2f6fd6; --user-soft: #dbe7fb; --agent: #d9731a; --agent-soft: #fbe6d3;
  --other: #6f6f78; --other-soft: #e9e9ee; --good: #1f8a4c; --bad: #c43d3d; --overlap: rgba(196, 61, 61, .10);
  --cursor: #8a3ffc; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; --listen: #c9c9cf; --mid: #b07d10;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151517; --panel: #1e1e21; --ink: #ececef; --muted: #9a9aa2; --line: #333338; --soft: #26262a;
    --user: #6ea0ff; --user-soft: #1f3252; --agent: #ffa35c; --agent-soft: #4a2e16;
    --other: #a8a8b3; --other-soft: #2c2c33; --good: #4cc47f; --bad: #ff6b6b; --overlap: rgba(255, 107, 107, .12);
    --cursor: #b58cff; --listen: #45454d; --mid: #e0b04a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
.app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
a.back { display: inline-block; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 6px; }
a.back:hover { color: var(--ink); }
button.playing { background: var(--cursor); border-color: var(--cursor); color: #fff; }
aside h1 { font-size: 14px; margin: 0 0 8px; }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.cases { overflow: auto; flex: 1; }
.case { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.case:hover { background: var(--soft); }
.case.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); }
.case .id { font-weight: 600; word-break: break-all; }
.case .sub { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
main { overflow: auto; padding: 16px 20px 40px; min-width: 0; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 18px; }
.tracebtn { margin-left: auto; align-self: center; font-size: 12px; font-weight: 500; text-decoration: none; color: var(--agent); border: 1px solid var(--agent); border-radius: 6px; padding: 3px 10px; background: var(--agent-soft); }
.tracebtn:hover { filter: brightness(0.96); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip b { font-variant-numeric: tabular-nums; }
.ok { color: var(--good); } .no { color: var(--bad); } .mid { color: var(--mid); }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
section.card > h3 { margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
section.card > h3 .sp { flex: 1; }
.body { padding: 12px 14px; }
button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
button:hover { background: var(--soft); }
.tl { display: grid; grid-template-columns: 150px 1fr; }
.labels { border-right: 1px solid var(--line); position: relative; }
.labels div { position: absolute; left: 0; right: 0; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; font-size: 12px; }
.labels small { color: var(--muted); font-family: var(--mono); font-size: 10.5px; word-break: break-all; }
.scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
svg { display: block; }
svg text { font-size: 11px; fill: var(--ink); }
.axis text { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.axis line { stroke: var(--line); }
.hit { cursor: pointer; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 12px; z-index: 10; display: none; white-space: pre-wrap; }
.tip b { font-family: var(--mono); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } .app { grid-template-columns: 200px 1fr; } }
.state .row { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.state .row:last-child { border-bottom: 0; }
.state .screen img { display: block; max-width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.who { display: inline-block; font-weight: 600; font-size: 11px; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
.who.user { background: var(--user-soft); color: var(--user); } .who.agent { background: var(--agent-soft); color: var(--agent); } .who.other { background: var(--other-soft); color: var(--other); }
.heard { } .unheard { color: var(--muted); opacity: .75; } .unsaid { color: var(--muted); text-decoration: line-through; }
.tag { font-size: 11px; color: var(--muted); margin-left: 6px; }
.cat { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.cat.chitchat { color: var(--other); } .cat.sop { color: var(--mid); } .cat.tool_call { color: var(--user); }
.cats { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.cats button.cat { background: none; cursor: pointer; font: inherit; font-size: 11px; opacity: .45; }
.cats button.cat.on { opacity: 1; font-weight: 600; }
.evsub { font-size: 12px; font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.evsub + .hint, .evdesc { margin-bottom: 8px; }
.evblock + .evblock { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.policy-target { border-left: 3px solid var(--mid); padding: 2px 0 2px 10px; margin: 6px 0 10px; }
.tag.cut { color: var(--bad); } .tag.barge { color: var(--cursor); }
.tr { display: grid; grid-template-columns: 118px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tr:hover { background: var(--soft); }
.tr .time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tr.now { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
td.mono { font-family: var(--mono); white-space: nowrap; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--soft); }
tr.future td { opacity: .45; }
table.kv tr { cursor: default; } table.kv tr:hover { background: none; } table.kv td { font-size: 12.5px; }
pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: auto; font: 11.5px/1.45 var(--mono); max-height: 320px; }
.tablewrap { max-height: 420px; overflow: auto; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; }
details.tool { padding: 2px 0; } details.tool:not([open]) summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } details.tool summary { cursor: pointer; } details.tool b { font-family: var(--mono); font-weight: 500; }
.upd { margin: 6px 0; padding-left: 8px; border-left: 2px solid var(--line); }
.play { margin-left: 6px; padding: 0 6px; font-size: 10px; line-height: 16px; }

/* ---------- live playback ---------- */
.ctrl { display: inline-flex; align-items: center; gap: 6px; }
.ctrl select { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 1px 4px; }
.clock { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowbar { display: grid; grid-template-columns: 1fr 1fr minmax(180px, .8fr); gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.party { min-width: 0; }
.party .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 20px; }
.st { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.st.on { color: #fff; } .party.user .st.on { background: var(--user); } .party.agent .st.on { background: var(--agent); }
.st.warn { background: var(--cursor); color: #fff; } .st.bad { background: var(--bad); color: #fff; }
.st.on::before, .st.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.unitchip { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.unitchip b { font-weight: 600; } .unitchip .speak { color: var(--agent); }
.bubble { position: relative; margin-top: 6px; padding: 5px 9px; border-radius: 10px; font-size: 12.5px; min-height: 28px; background: var(--soft); color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.party.user .bubble.on { background: var(--user-soft); color: var(--ink); } .party.agent .bubble.on { background: var(--agent-soft); color: var(--ink); }
.bubble.on::after { content: "▍"; color: var(--cursor); animation: pulse .8s step-end infinite; }
.counters { font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; align-content: start; }
.counters span { color: var(--muted); } .counters b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.headline { padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; min-height: 31px; cursor: pointer; }
.headline .lbl { font: 600 10px var(--mono); letter-spacing: .06em; color: var(--cursor); white-space: nowrap; }
.headline.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--cursor) 22%, transparent); } to { background: transparent; } }
.ticker { max-height: 440px; overflow: auto; }
.hl { display: grid; grid-template-columns: 54px 16px 1fr auto; gap: 6px; align-items: baseline; padding: 5px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.hl:hover { background: var(--soft); }
.hl .tm { font: 11px var(--mono); color: var(--muted); }
.hl .ic { font-weight: 700; text-align: center; } .hl .tx { min-width: 0; }
.hl .meta { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.hl.future { opacity: .45; }
.hl.cur { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); opacity: 1; }
.hl.live { opacity: 1; } .hl.live .ic::before { content: "●"; color: var(--cursor); animation: pulse 1s ease-in-out infinite; }
.hl.live .ic span { display: none; }
.hl pre { grid-column: 1 / -1; margin: 4px 0 2px; max-height: 260px; cursor: text; }
.hl .src { font: 10px var(--mono); color: var(--muted); }
.sc { font: 11px var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; }
.sc.ok { color: var(--good); } .sc.no { color: var(--bad); } .sc.mid { color: var(--mid); } .sc.na { color: var(--muted); border-style: dashed; }
.xp { border: 0; background: none; padding: 0 3px; color: var(--muted); font-size: 11px; }
.tally { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.tally .big { font: 600 16px var(--mono); font-variant-numeric: tabular-nums; }
.tally .bar { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; min-width: 80px; }
.tally .bar i { display: block; height: 100%; background: var(--good); transition: width .25s; }
.tr .txt { margin-top: 1px; }
.tr.future .txt { opacity: .55; }
.tr.now .w { opacity: .4; transition: opacity .12s; } .tr.now .w.said { opacity: 1; }
.tr.now .w.cur { opacity: 1; border-radius: 3px; box-shadow: 0 0 0 2px var(--cursor-soft, transparent); background: color-mix(in srgb, var(--cursor) 18%, transparent); }
svg rect.u { opacity: .3; } svg rect.u.past { opacity: .85; } svg rect.u.cur { opacity: 1; stroke: var(--cursor); stroke-width: 2; }
svg text.ut { font: 9.5px var(--mono); fill: var(--ink); pointer-events: none; }
@media (max-width: 900px) { .nowbar { grid-template-columns: 1fr 1fr; } .counters { grid-column: 1 / -1; grid-template-columns: repeat(4, auto 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { overflow: visible; padding: 12px 10px 30px; }
  .tl { grid-template-columns: 78px 1fr; } .labels small { display: none; }
  .nowbar { grid-template-columns: 1fr; } .counters { grid-template-columns: auto 1fr auto 1fr; }
  .tr { grid-template-columns: 1fr; gap: 2px; } .hl { grid-template-columns: 46px 14px 1fr; } .hl .meta { grid-column: 3; }
  section.card > h3 { flex-wrap: wrap; }
}
</style>

faaab53deaa1ec264bd88f97210b4ba802c7.mp3", "sr": 24000, "start_ms": 0, "end_ms": 10160}}, {"id": "s1", "role": "user", "start_time": 33667, "end_time": 34227, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/7f/7f4ca596d1a8ec6bd2b974e1dea4181a80c605643988346888b7ec7dc1f1c89e.mp3", "sr": 24000, "start_ms": 0, "end_ms": 560}}, {"id": "u3", "role": "user", "start_time": 39638, "end_time": 43618, "text": "哦，原来是这个原理。谢谢啦，再见！", "media": {"kind": "audio", "uri": "media/3b/3be5bae52f625b812039b064c5f18f72ad823107f297097a4bd22a79f77a4717.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3980}}, {"id": "a:resp-duplex-2fc9bf903a8f441389b011bb032f08d2-0-45114f66:46000", "role": "agent", "start_time": 46000, "end_time": 48760, "text": "不客气，再见。", "media": {"kind": "audio", "uri": "media/13/13179d60f81bb8d52f7d5512d04bbf5771c39b32ca67670d03facdfbc68f70b1.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2760}}], "eval": {"reward": {"total": null, "parts": {}}, "duplex": {"s1": {"behavior": "backchannel", "target": "a:resp-duplex-2fc9bf903a8f441389b011bb032f08d2-0-40e609cc:29000", "reaction": "continued"}}, "scores": {"events": [{"turn": "u0", "expects": "respond", "outcome": "responded", "latency_ms": 520, "score": 0.9866130821723351, "target": "a:resp-duplex-2fc9bf903a8f441389b011bb032f08d2-0-565c7a6d:5000", "resolved_ms": 5000, "user_start_ms": 0, "user_end_ms": 4480}, {"turn": "u1", "expects": "respond", "outcome": "responded", "latency_ms": 542, "score": 0.9833736438921183, "target": "a:resp-duplex-2fc9bf903a8f441389b011bb032f08d2-0-b22bf0f9:18000", "resolved_ms": 18000, "user_start_ms": 12818, "user_end_ms": 17458}, {"turn": "u2", "expects": "respond", "outcome": "responded", "latency_ms": 146, "score": 0.9996777948994687, "target": "a:resp-duplex-2fc9bf903a8f441389b011bb032f08d2-0-40e609cc:29000", "resolved_ms": 29000, "user_start_ms": 23974, "user_end_ms": 28854}, {"turn": "s1", "expects": "ignore", "outcome": "ignored", "score": 1.0, "ta te_per_min": 0.05, "source": "surroundings", "level_db": -14.0, "burst_p": 0.7, "burst_max": 5, "gap_ms": [1500, 3000], "mean_burst": 2.773}, "sneeze": {"rate_per_min": 0.01, "source": "user", "level_db": 0.0, "burst_p": 0.15, "burst_max": 2, "gap_ms": [400, 1200], "mean_burst": 1.15}}}, "min_gap_ms": 3000, "max_backchannels_per_turn": 3, "max_asides_per_turn": 1, "max_pauses_per_turn": 2, "persona": {"backchanneling": "normal", "surroundings": "office", "hesitancy": "normal"}}, "decisions": {"points": 27, "boundary": 23, "fallback": 4, "too_few_words": 1, "capped": 3, "llm_calls": 26, "LISTEN": 24, "BACKCHANNEL": 2, "INTERRUPT": 0, "rule_interrupts": 0}, "random_events": {"noise": 0, "noise_occurrences": 0, "noise_over_user": 0, "aside": 0, "called_away": 0, "capped": 0, "lines_llm": 0, "lines_fixed": 0}}, "agent": {"name": "MiniCPM-o 4.5", "model": "openbmb/MiniCPM-o-4_5", "kind": "full-duplex", "server": "vllm-omni duplex ws://127.0.0.1:8210/v1/realtime?duplex=1", "clock": "input", "audio_out": true, "output": "audio"}, "wall_s": 28.4}, "background": [{"media": {"kind": "audio", "uri": "media/b1/b1e3092cde548af9e7831d352e38a26bda2158c095688f41234a02d77f387096.mp3", "sr": 24000, "start_ms": 169254, "end_ms": 254254}, "loop": true, "spec": {"type": "ambience:office", "level_dbfs": -48.0, "snr_db": 28.0, "source": "file:soundbank/ambience/office/ooffice.wav", "from": "surroundings", "surroundings": "office"}}], "turns": [{"id": "u0", "role": "user", "start_time": 0, "end_time": 3920, "text": "我最近开始自己带饭了，你觉得带饭健康吗？", "media": {"kind": "audio", "uri": "media/06/06271a2d03ac28f7738793495da28c1784efff580267df6146468cd926949cfc.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3920}}, {"id": "a:resp-duplex-7003dd43c780442295e8ee82c9954def-0-3be2a3b6:4000", "role": "agent", "start_time": 4000, "end_time": 9080, "text": "我觉得带饭健康，只要注意营养均衡，少油少盐就好。", "media": {"kind": "audio", "uri": "media/07/07d302fbb1c6bc45c5dfe1538637c59609047fca6def0a37e1ab9549fdb43eb5.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5080}}, {"id": "u1", "role": "user", "start_time": 11804, "end_time": 19664, "text": "对，少油少盐是好事。不过我听说隔夜菜都会致癌，一口都不能吃，我带饭是不是白忙活了？", "media": {"kind": "audio", "uri": "media/85/853514e35886fda4bee899079a9bd09c970d720859e8fd54f5fb6eff45a4d7fe.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7860}}, {"id": "a:resp-duplex-7003dd43c780442295e8ee82c9954def-0-fd13adc5:21000", "role": "agent", "start_time": 21000, "end_time": 36840, "text": "这个说法不准确哦，隔夜菜不会致癌，只是如果储存不当或者加热不够彻底，可能容易滋生细菌。你只要密封保存、热透再吃就没问题的。", "media": {"kind": "audio", "uri": "media/91/910756e984bbd6c2650e7e446efdc51294d8603264a0a186756011cdebbd5a74.mp3", "sr": 24000, "start_ms": 0, "end_ms": 15840}}, {"id": "s1", "role": "user", "start_time": 31283, "end_time": 31883, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/5d/5db81e8aeb6a370c36345a7a359490de8f977c900258517ccb263096429fc744.mp3", "sr": 24000, "start_ms": 0, "end_ms": 600}}, {"id": "u2", "role": "user", "start_time": 37426, "end_time": 43166, "text": "哦？为什么啊？我还真没细想过，一直以为剩菜就是有毒呢。", "media": {"kind": "audio", "uri": "media/e7/e76765860555756d0a76d1549c14c160c89e9487cbbf1af3b675323fdbb25f78.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5740}}, {"id": "a:resp-duplex-7003dd43c780442295e8ee82c9954def-0-5119505b:44000", "role": "agent", "start_time": 44000, "end_time": 58240, "text": "因为剩菜变质主要靠细菌繁殖，但只要热透了，大部分细菌都会被杀死。关键是别让饭菜在室温里放太久就行。", "media": {"kind": "audio", "uri": "media/2d/2d69dcef62c1403555a204eb7730d4b269564e0a2b47ba1f4de1060a9235bbf1.mp3", "sr": 24000, "start_ms": 0, "end_ms": 14240}}, {"id": "s2", "role": "user", "start_time": 52728, "end_time": 53188, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/de/ded053b2385a4893fc9d9482fe9ab710fed41b71ab1fa9f404ecbd3d3a41310a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 460}}, {"id": "u3", "role": "user", "start_time": 58594, "end_time": 62974, "text": "这样啊，那我就放心了。那带饭怎么保存才安全？", "media": {"kind": "audio",   const dump = (o, ind) => {
    const sp = ' '.repeat(ind);
    if (Array.isArray(o) && o.length && typeof o[0] === 'object' && ind <= 2) return '[\n' + o.map(x => sp + '  ' + JSON.stringify(x)).join(',\n') + '\n' + sp + ']';
    if (o && typeof o === 'object' && !Array.isArray(o) && ind <= 2 && Object.values(o).some(v => v && typeof v === 'object'))
      return '{\n' + Object.entries(o).map(([k, v]) => sp + ' ' + JSON.stringify(k) + ': ' + dump(v, ind + 1)).join(',\n') + '\n' + sp + '}';
    return JSON.stringify(o);
  };
  return dump(ep, 0);
}

function toolHtml(t) {
  return `<details class="tool"><summary><b>${esc(t.name)}</b>${t.service ? ` <span class="tag">${esc(t.service)}</span>` : ''} <span class="hint">${esc(t.description || '')}</span></summary><pre>${esc(JSON.stringify(t.parameters || {}, null, 2))}</pre></details>`;
}
function modelTxt(x) {
  if (!x) return '—';

}
function userHtml(c) {

function envHtml(c) {

// meta.policy: the procedure (SOP) the agent had to follow; the requested action's own entry first, then the whole text

    ${p.target ? `<div class="hint">conditions for the requested action</div><pre class="policy-target">${esc(p.target)}</pre>` : ''}

    ${p.note ? `<div class="hint" style="margin-top:6px">${esc(p.note)}</div>` : ''}</div></section>`;

function renderEval() {
  const ep = cur.episode, wrap = $('#evalwrap');
  if (!ep || !ep.eval) { wrap.hidden = true; return; }
  const r = ep.eval.reward || {}, dup = Object.entries(ep.eval.duplex || {}), byId = Object.fromEntries(ep.turns.map(t => [t.id, t]));
  const vf = ep.eval.verifier || null, checks = (vf && vf.checks) || {};
  const partCls = v => v === true || v === 1 ? 'ok' : v === false || v === 0 ? 'no' : '';
  const partRows = Object.entries(r.parts || {}).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="num ${partCls(v)}" style="font-weight:600">${v === true ? '✓' : v === false ? '✗' : esc(typeof v === 'number' ? +v.toFixed(3) : v)}</td><td class="hint" style="white-space:normal">${esc(checks[k] || '')}</td></tr>`).join('');
  const content = r.total == null && !vf && !partRows ? '<div class="hint">No content evaluation for this task: it defines no reward and no verifier (open conversation); only the duplex timing below is scored.</div>'
    : `<div class="chips" style="margin:0 0 8px"><span class="chip">reward <b class="${r.total == null ? '' : r.total > 0 ? 'ok' : 'no'}">${r.total ?? '— (not computed)'}</b></span>${vf && vf.name ? `<span class="chip">verifier <b>${esc(vf.name)}</b></span>` : ''}</div>
      ${vf && vf.description ? `<div class="hint evdesc" style="white-space:normal">${esc(vf.description)}</div>` : ''}
      ${partRows ? `<div class="tablewrap"><table><thead><tr><th>check</th><th style="text-align:right">result</th><th>what it checks</th></tr></thead><tbody>${partRows}</tbody></table></div>` : ''}`;
  const group = (keys) => { const xs = dup.filter(([, d]) => keys.includes(d.behavior)); return [xs.filter(([id, d]) => verdict(ep, id, d)).length, xs.length]; };
  const [by, bn] = group(['barge_in']), [ry, rn] = group(['backchannel', 'aside', 'noise', 'away']), ai = dup.filter(([, d]) => d.behavior === 'agent_interrupt').length;
  const stat = (label, y, n) => n ? `<span class="chip">${label} <b class="${y === n ? 'ok' : 'no'}">${y}/${n}</b></span>` : '';
  const rows = dup.map(([id, d]) => {
    const ok = verdict(ep, id, d), t = byId[id] || {}, tg = byId[d.target] || {};
    const snip = s => esc((s || '').slice(0, 42)) + ((s || '').length > 42 ? '…' : '');
    return `<tr data-t="${t.start_time}"><td class="mono">${esc(id)}</td><td>${esc(d.behavior)}</td><td class="mono">${t.start_time}ms</td>
      <td>${snip(t.text) || '<span class="hint">(no words)</span>'}</td><td>${esc(EXPECTED[d.behavior] || '')}</td>
      <td>${d.target ? `<span class="mono">${esc(d.target)}</span> <span class="hint">${snip(tg.text)}</span>` : '<span class="hint">agent silent</span>'}</td>
      <td>${esc(d.reaction || '—')}</td><td class="num">${d.latency_ms != null ? d.latency_ms + 'ms' : ''}</td>
      <td style="font-weight:600" class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</td></tr>`;
  }).join('');
  const sc = ep.eval.scores || null, byT = Object.fromEntries(ep.turns.map(t => [t.id, t]));
  const scoreCls = v => v == null ? '' : v >= 0.8 ? 'ok' : v < 0.5 ? 'no' : '';
  const scoreChips = sc ? `<span class="chip">score <b class="${sc.total == null ? '' : scoreCls(sc.total)}">${sc.total ?? '—'}</b></span>` +
    Object.entries(sc.by_expectation || {}).map(([k, v]) => `<span class="chip">${esc(k)} <b class="${scoreCls(v)}">${v}</b></span>`).join('') : '';
  const scoreRows = sc ? sc.events.map(e => { const t = byT[e.turn] || {};
    return `<tr data-t="${t.start_time}"><td class="mono">${esc(e.turn)}</td><td>${esc(e.expects)}</td><td class="mono">${t.start_time}ms</td>
      <td>${esc((t.text || '').slice(0, 42))}</td><td>${esc(e.outcome)}</td><td class="mono">${esc(e.target || '')}${e.reply ? ` → ${esc(e.reply)}` : ''}</td><td class="num">${e.latency_ms != null ? e.latency_ms + 'ms' : ''}</td>
      <td class="num ${scoreCls(e.score)}" style="font-weight:600">${e.score != null ? e.score.toFixed(2) : '<span class="sc na" title="left out of the means">not scored</span>'}</td></tr>`; }).join('') : '';
  $('#evalcard').innerHTML = `
    <div class="evblock"><div class="evsub">Content <span class="hint" style="font-weight:400">eval.reward · eval.verifier — the task's own check of what was done</span></div>${content}</div>
    <div class="evblock"><div class="evsub">Duplex timing <span class="hint" style="font-weight:400">eval.scores · eval.duplex — rule-based, from the timeline</span></div>
    ${sc ? `<div class="hint" style="margin-bottom:4px">scores — one per user turn: did the agent do what the user expected, and how fast when it took over (rule-based, 0–1; eval.scores; total = mean over the turns)</div>
    <div class="chips" style="margin:0 0 8px">${scoreChips}</div>
    ${sc.events.length ? `<div class="tablewrap" style="max-height:260px;margin-bottom:12px"><table><thead><tr><th>user turn</th><th>user expects</th><th>at</th><th>what the user said</th><th>outcome</th><th>agent turn</th><th style="text-align:right">latency</th><th style="text-align:right">score</th></tr></thead><tbody>${scoreRows}</tbody></table></div>` : ''}
    <div class="hint" style="margin-bottom:4px">special duplex behaviours (eval.duplex)</div>` : ''}
    <div class="chips" style="margin:0 0 10px">
      ${stat('barge-in handled', by, bn)}${stat('rejection correct', ry, rn)}${ai ? `<span class="chip">agent interruptions <b class="no">${ai}</b></span>` : ''}
    </div>
    ${dup.length ? `<div class="tablewrap" style="max-height:260px"><table><thead><tr><th>turn</th><th>behaviour</th><th>at</th><th>what the user did</th><th>expected</th><th>agent turn affected</th><th>reaction</th><th style="text-align:right">latency</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="hint">No special duplex behaviour in this episode (only normal turn-taking).</div>'}</div>`;
  document.querySelectorAll('#evalcard tbody tr').forEach(el => el.onclick = () => { const t = +el.dataset.t; setCursor(t); scrollTo(t); });
  wrap.hidden = false;
}

function setZoom(z, anchorT) {
  const sc = $('#scroll');
  const t = anchorT ?? (sc.scrollLeft + sc.clientWidth / 2) / zoom;
  const offset = anchorT != null ? anchorT * zoom - sc.scrollLeft : sc.clientWidth / 2;
  zoom = Math.min(Math.max(z, 0.005), 5);
  renderTimeline();
  sc.scrollLeft = t * zoom - offset;
}

// ---------- timeline ----------
const PAD = 16, AXIS = 26, SPANS = 50;
function laneY(c) {
  let y = AXIS; const ys = [];
  c.lanes.forEach(l => { ys.push(y); y += l.h; });
  return {ys, spansY: y, H: y + SPANS};
}
function renderTimeline() {
  const c = cur, sc = $('#scroll');
  if (zoom == null) zoom = Math.max((sc.clientWidth - 2 * PAD - 140) / c.tMax, 0.005);
  const X = t => PAD + t * zoom, W = X(c.tMax) + PAD + 140; // room for trailing labels
  c.lanes.filter(l => l.kind === 'envtool').forEach(l => {   // tools offered at the same moment stack up
    const byT = {};
    l.items.forEach((it, i) => { it.idx = i; it.row = (byT[it.t] = (byT[it.t] ?? -1) + 1); });
    l.h = 12 + Math.max(...Object.values(byT).map(n => n + 1)) * 20;
  });
  c.lanes.filter(l => l.kind === 'tool').forEach(l => {   // stack calls so that labels never collide
    const rowEnd = [];
    l.calls.forEach(k => {
      const a = k.call.data, args = Object.entries(a.arguments).map(([n, v]) => n + '=' + JSON.stringify(v)).join(', ');
      const err = k.res && k.res.data.error;
      let lab = `${err ? '✗ ' : ''}${a.name}(${args})`;
      if (lab.length > 64) lab = lab.slice(0, 64) + '…)';
      k.label = lab + (k.t1 == null ? '  (no result)' : `  ${fmt(k.t1 - k.t0)}`);
      const x0 = X(k.t0), x1 = Math.max(k.t1 == null ? X(c.tMax) : X(k.t1), x0 + 6), lw = k.label.length * 6.2 + 12;
      k.inside = x1 - x0 >= Math.min(lw, 90); // the bar's width is the tool latency; short calls cannot hold their label
      const right = k.inside ? x1 : x1 + lw;
      let r = rowEnd.findIndex(e => e < x0 - 8);
      if (r < 0) r = rowEnd.length;
      rowEnd[r] = right; k.row = r;
    });
    l.h = 12 + Math.max(rowEnd.length, 1) * 22;
  });
  const {ys, spansY, H} = laneY(c);
  const col = r => `var(--${r})`, soft = r => `var(--${r}-soft)`;
  let s = `<svg width="${W}" height="${H}" id="svg">`;
  // axis
  const steps = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 60000, 120000, 300000];
  const step = steps.find(v => v * zoom >= 70) || steps[steps.length - 1];
  s += '<g class="axis">';
  for (let t = 0; t <= c.tMax; t += step) s += `<line x1="${X(t)}" x2="${X(t)}" y1="${AXIS - 6}" y2="${H}" /><text x="${X(t) + 3}" y="${AXIS - 10}">${fmt(t)}</text>`;
  s += '</g>';
  // lane backgrounds
  c.lanes.forEach((l, k) => { if (k % 2) s += `<rect x="0" y="${ys[k]}" width="${W}" height="${l.h}" fill="var(--soft)" opacity=".5"/>`; });
  // overlaps
  const segYs = c.lanes.map((l, k) => l.kind === 'seg' ? ys[k] : null).filter(v => v != null);
  if (segYs.length) {
    const y0 = Math.min(...segYs), y1 = Math.max(...c.lanes.map((l, k) => l.kind === 'seg' ? ys[k] + l.h : 0));
    c.overlaps.forEach(([a, b]) => { s += `<rect x="${X(a)}" y="${y0}" width="${Math.max((b - a) * zoom, 1)}" height="${y1 - y0}" fill="var(--overlap)"><title>overlap ${fmt(b - a)}</title></rect>`; });
  }
  let clip = 0;
  c.lanes.forEach((l, k) => {
    const y = ys[k];
    if (l.kind === 'seg') {
      l.turns.forEach(t => {
        const p = t.planned, a = t.actual, py = y + 9, ph = l.h - 18;
        const ax = X(a.t0), aw = Math.max(a.dur * zoom, 2), pw = Math.max(p.dur * zoom, 2);
        s += `<rect x="${X(p.t0)}" y="${py}" width="${pw}" height="${ph}" rx="5" fill="none" stroke="${col(t.role)}" stroke-dasharray="4 3" opacity=".55"/>`;
        s += `<rect class="hit" data-turn="${t.stream}|${t.id}" x="${ax}" y="${py}" width="${aw}" height="${ph}" rx="5" fill="${soft(t.role)}" stroke="${col(t.role)}"/>`;
        const id = 'c' + (clip++);
        s += `<clipPath id="${id}"><rect x="${X(p.t0) + 4}" y="${py}" width="${Math.max(pw - 8, 0)}" height="${ph}"/></clipPath>`;
        const spoken = segText(a), rest = segText(p).slice(spoken.length);
        s += `<text clip-path="url(#${id})" x="${ax + 6}" y="${py + ph / 2 + 4}" pointer-events="none"><tspan>${esc(modality(a) + tagOf(t) + spoken)}</tspan>${rest ? `<tspan fill="var(--muted)" text-decoration="line-through">${esc(rest)}</tspan>` : ''}</text>`;
        if (t.cut) {
          const lab = t.causeLabel || 'cut', c2 = t.cause && t.causeOk ? 'var(--cursor)' : 'var(--bad)';
          s += `<line x1="${X(end(a))}" x2="${X(end(a))}" y1="${py - 5}" y2="${py + ph + 5}" stroke="${c2}" stroke-width="2"/><text x="${X(end(a)) + 3}" y="${py - 1}" style="fill:${c2};font-size:10px">${esc(lab)}</text>`;
        }
      });
    } else if (l.kind === 'units') {
      const w = Math.max(l.units[0] ? (l.units[0].t1 - l.units[0].t0) * zoom - 1.5 : 2, 1.5), cy = y + 4, ch = l.h - 8;
      l.units.forEach((u, j) => {
        const x = X(u.t0) + .75, fill = u.decision === 'speak' ? 'var(--agent)' : u.decision === 'listen' ? 'var(--listen)' : 'var(--user)';
        s += `<rect class="hit u" data-unit="${j}" x="${x}" y="${cy}" width="${w}" height="${ch}" rx="2" fill="${fill}"/>`;
        if (u.marks.includes('<|turn_eos|>')) s += `<path d="M${x + w - 6} ${cy} h6 v6 Z" fill="var(--bad)" pointer-events="none"><title>turn_eos</title></path>`;
        if (u.decision === 'speak' && u.marks.includes('<|listen|>')) s += `<circle cx="${x + w - 3}" cy="${cy + ch - 3}" r="2.2" fill="var(--ink)" pointer-events="none"/>`;
        if (w > 28 && u.text.trim()) s += `<clipPath id="uc${j}"><rect x="${x + 2}" y="${cy}" width="${w - 4}" height="${ch}"/></clipPath><text class="ut" clip-path="url(#uc${j})" x="${x + 3}" y="${cy + ch / 2 + 3.5}">${esc(u.text.trim())}</text>`;
      });
    } else if (l.kind === 'bg') {
      l.items.forEach(it => {
        const x0 = X(it.a), x1 = X(it.b == null ? c.tMax : it.b), lab = bgLabel(it.spec), silent = it.spec.type === 'silence';
        s += `<rect x="${x0}" y="${y + 5}" width="${Math.max(x1 - x0, 2)}" height="${l.h - 10}" rx="4" fill="${silent ? 'none' : 'var(--other-soft)'}" stroke="var(--other)" ${silent ? 'stroke-dasharray="3 3"' : ''}><title>${esc(JSON.stringify(it.spec))}</title></rect>`
          + `<text x="${x0 + 6}" y="${y + l.h / 2 + 4}" pointer-events="none" style="fill:var(--muted);font-size:10.5px">${esc(lab)}</text>`;
      });
    } else if (l.kind === 'envtool') {
      l.items.forEach(it => {
        const ps = Object.keys((it.tool.parameters || {}).properties || {}), lab = `${it.tool.name}(${ps.join(', ')})`;
        const x = X(it.t), by = y + 6 + it.row * 20, w = lab.length * 6.2 + 14;
        s += `<g class="hit" data-envtool="${it.idx}"><rect x="${x}" y="${by}" width="${w}" height="16" rx="8" fill="var(--soft)" stroke="var(--other)"/>`
          + `<text x="${x + 7}" y="${by + 12}" style="font-family:var(--mono);font-size:10.5px">${esc(lab)}</text></g>`;
      });
    } else if (l.kind === 'tool') {
      l.calls.forEach(k => {
        const x0 = X(k.t0), x1 = k.t1 == null ? X(c.tMax) : X(k.t1), err = k.res && k.res.data.error;
        const color = err ? 'var(--bad)' : col(l.role), by = y + 8 + k.row * 22, bh = 16;
        s += `<rect class="hit" data-tool="${c.tools.indexOf(k)}" x="${x0}" y="${by}" width="${Math.max(x1 - x0, 6)}" height="${bh}" rx="4" fill="${err ? 'var(--overlap)' : soft(l.role)}" stroke="${color}" ${k.t1 == null ? 'stroke-dasharray="4 3"' : ''}/>`;
        const cid = 'tc' + c.tools.indexOf(k);

    const replied = prev && as.some(a => a.actual.t0 >= end(prev.actual) && a.actual.t0 <= t);
    if (aNow && next && isNormal(next) && next.actual.t0 - t <= 800 && next.actual.t0 < end(aNow.actual)) {
      U.st = `about to barge in · ${fmt(next.actual.t0 - t)}`; U.cls = 'warn';
    } else if (prev && prev.rec && prev.rec.expects === 'wait' && !replied && (!next || next.actual.t0 > t)) {
      U.st = `pause mid-thought · ${fmt(t - end(prev.actual))}`;
    } else if (prev && !replied && !aNow) {
      U.st = `waiting for a reply · ${fmt(t - end(prev.actual))}`;
    } else if (aNow) U.st = 'listening';
    const last = us.filter(x => end(x.actual) <= t).pop();
    U.bubble = last ? segText(last.actual) : '';
  }
  // agent
  if (aNow) {
    const over = us.find(u => isNormal(u) && u.actual.t0 >= aNow.actual.t0 && u.actual.t0 <= t && end(aNow.actual) <= end(u.actual) + 1);
    const talkingOver = uNow && isNormal(uNow);
    if (over && (aNow.cut || end(aNow.actual) < end(over.actual))) { A.st = `yielding · barged in ${fmt(t - over.actual.t0)} ago`; A.cls = 'warn'; }
    else if (talkingOver) { A.st = 'talking over the user'; A.cls = 'bad'; }
    else { A.st = 'speaking'; A.cls = 'on'; }
    A.bubble = saidSoFar(aNow, t); A.live = true;
  } else {
    A.st = uNow ? 'listening' : 'silent';
    const last = as.filter(x => end(x.actual) <= t).pop();
    A.bubble = last ? segText(last.actual) : '';
  }
  return {U, A};
}
function unitAt(t) {
  const l = cur.lanes.find(x => x.kind === 'units');
  if (!l) return null;
  let k = -1;
  for (let i = 0; i < l.units.length && l.units[i].t0 <= t; i++) k = i;
  return {l, k, u: k >= 0 && t < l.units[k].t1 ? l.units[k] : null};
}
function talkSoFar(role, t) {
  return cur.turns.filter(x => x.role === role).reduce((s, x) => s + Math.max(0, Math.min(end(x.actual), t) - x.actual.t0), 0);
}
const scoreCls = v => v >= 0.8 ? 'ok' : v < 0.5 ? 'no' : 'mid';
// a headline's score chip: the score, or a grey "not scored" for an eval.scores event without one (censored)
const scChip = h => h.score != null ? `<span class="sc ${scoreCls(h.score)}" title="eval.scores: ${esc(h.expects)} → ${esc(h.outcome)}">${h.score.toFixed(2)}</span>`
  : h.source === 'eval.scores' ? `<span class="sc na" title="eval.scores: ${esc(h.expects)} → ${esc(h.outcome)} (left out of the score)">not scored</span>` : '';
function setSt(id, st, cls) { const el = $(id); if (el.textContent !== st) el.textContent = st; el.className = 'st' + (cls ? ' ' + cls : ''); }
function setBubble(id, text, live) { const el = $(id); if (el.textContent !== text) el.textContent = text; el.classList.toggle('on', live); el.title = live ? '' : 'last thing said'; }
// headlines: rendered once per episode; playback toggles past / cur / live / future
function renderTicker() {
  const hs = cur.headlines, wrap = $('#tickwrap');
  if (!hs.length) { $('#ticker').innerHTML = '<div class="hint" style="padding:10px 12px">No evaluated events in this episode (no eval.scores / eval.duplex records).</div>'; $('#tally').hidden = true; return; }
  $('#tally').hidden = false;
  $('#ticker').innerHTML = hs.map((h, k) =>
    `<div class="hl future" data-k="${k}"><span class="tm">${(h.t / 1000).toFixed(1)}s</span>
      <span class="ic ${h.ok === false ? 'no' : h.ok === true ? (h.score != null && h.score < 0.5 ? 'mid' : 'ok') : ''}" title="${h.ok === true && h.score != null && h.score < 0.5 ? 'expected outcome, but a low score (slow)' : ''}"><span>${h.ok === true ? '✓' : h.ok === false ? '✗' : '·'}</span></span>
      <span class="tx">${esc(h.text.replace(/ [✓✗]$/, ''))}</span>
      <span class="meta">${scChip(h) || `<span class="src">${esc(h.behavior || '')}</span>`}<button class="xp" title="raw record">▸</button></span></div>`).join('');
  cur._hl = [...document.querySelectorAll('#ticker .hl')].map(el => ({el, h: hs[+el.dataset.k], st: 'future'}));
  cur._hl.forEach(({el, h}) => {
    el.onclick = e => {
      if (e.target.closest('pre')) return;
      if (e.target.classList.contains('xp')) {
        const pre = el.querySelector('pre');
        if (pre) { pre.remove(); e.target.textContent = '▸'; }
        else { el.insertAdjacentHTML('beforeend', `<pre>${esc(h.source)} · resolved at ${h.t_resolved}ms\n${esc(JSON.stringify(h.raw, null, 2))}</pre>`); e.target.textContent = '▾'; }
        return;
      }
      setCursor(h.t); scrollTo(h.t);
    };
  });
  cur._tallyKey = null;
}
function syncTicker(t, force) {
  const hs = cur.headlines;
  if (!hs.length) { $('#nhead').innerHTML = '<span class="lbl">EVENTS</span><span class="hint">none recorded</span>'; return; }
  // the current headline: the last one whose outcome is visible by t
  let last = null;
  hs.forEach(h => { if (h.t_resolved <= t) last = h; });
  let focus = null;
  (cur._hl || []).forEach(r => {
    const h = r.h, st = h === last ? 'cur' : h.t_resolved <= t ? 'past' : h.t <= t ? 'live' : 'future';
    if (st !== r.st) { r.el.classList.remove(r.st); r.el.classList.add(st); r.st = st; }
    if (st === 'cur') focus = r.el;
  });
  if (focus && playing) {
    const box = $('#ticker'), top = focus.offsetTop - box.offsetTop;
    if (top < box.scrollTop || top + focus.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = top - box.clientHeight / 2;
  }
  // the headline line in the timeline card
  const liveH = hs.filter(h => h.t <= t && t < h.t_resolved).pop();
  const show = liveH && (!last || liveH.t > last.t_resolved) ? liveH : last;
  if (show !== lastHl || force) {
    const flash = playing && show && show !== lastHl;
    lastHl = show;
    const el = $('#nhead');
    el.innerHTML = show ? `<span class="lbl">${show === liveH ? 'NOW' : 'LATEST'} · ${(show.t / 1000).toFixed(1)}s</span><span class="${show === liveH ? '' : show.ok === true ? 'ok' : show.ok === false ? 'no' : ''}">${esc(show === liveH ? show.pending : show.text)}</span>${show !== liveH ? scChip(show) : ''}`
      : '<span class="lbl">EVENTS</span><span class="hint">nothing evaluated yet — press ▶ or scrub</span>';
    if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  // running tally: eval.scores.total over the events resolved so far (precomputed per headline)
  const done = hs.filter(h => h.t_resolved <= t), key = done.length;
  if (key === cur._tallyKey && !force) return;
  cur._tallyKey = key;
  const scored = hs.filter(h => h.score != null), sd = done.filter(h => h.score != null);
  const ok = done.filter(h => h.ok === true).length, bad = done.filter(h => h.ok === false).length;
  const unscored = done.filter(h => h.source === 'eval.scores' && h.score == null).length;
  const tally = sd.length ? sd[sd.length - 1].tally : null, total = cur.view.total;
  const by = {};
  sd.forEach(h => (by[h.expects] = by[h.expects] || []).push(h.score));
  $('#tally').innerHTML = hs.some(h => h.source === 'eval.scores')
    ? `<span class="hint">score so far</span><span class="big ${tally == null ? '' : scoreCls(tally)}">${tally == null ? '—' : tally.toFixed(2)}</span>
       <span class="bar" title="events resolved"><i style="width:${scored.length ? 100 * sd.length / scored.length : 0}%"></i></span>
       <span class="hint">${sd.length}/${scored.length} user turns · <span class="ok">${ok} ✓</span> <span class="no">${bad} ✗</span>${unscored ? ` · <span title="cut off by the episode end; left out of the score, as in eval.scores">${unscored} not scored</span>` : ''} · final <b>${total == null ? '—' : total}</b></span>
       <span style="flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap">${Object.entries(by).map(([k, v]) => { const m = v.reduce((a, b) => a + b, 0) / v.length; return `<span class="chip" style="padding:0 8px">${esc(k)} <b class="${scoreCls(m)}">${m.toFixed(2)}</b> <span class="hint">×${v.length}</span></span>`; }).join('')}</span>`
    : `<span class="hint">duplex events</span><span class="big">${ok}✓ ${bad}✗</span><span class="hint">${done.length}/${hs.length} passed · no eval.scores in this episode, so no score</span>`;
}
function syncUnits(t) {
  const ua = unitAt(t);
  if (!ua) return null;
  if (!cur._uel || !cur._uel[0] || !cur._uel[0].isConnected) { cur._uel = [...document.querySelectorAll('#svg rect.u')]; cur._uk = null; }
  const key = ua.k + ':' + !!ua.u;
  if (key !== cur._uk) {
    cur._uk = key;
    cur._uel.forEach((el, i) => { el.classList.toggle('past', i < ua.k || (i === ua.k && !ua.u)); el.classList.toggle('cur', i === ua.k && !!ua.u); });
  }
  return ua.u;
}
function syncLive(t, force) {
  if (!cur || !$('#nowbar')) return;
  const endT = cur.t_end || cur.tMax;
  $('#clock').textContent = `${(t / 1000).toFixed(1)} / ${(endT / 1000).toFixed(1)} s`;
  const {U, A} = partyNow(t);
  setSt('#nu-st', U.st, U.cls); setBubble('#nu-b', U.bubble, U.live);
  setSt('#na-st', A.st, A.cls); setBubble('#na-b', A.bubble, A.live);
  const u = syncUnits(t), uc = $('#na-u');
  const uh = u ? `${cur.view.agent_page ? `<a href="${esc(cur.view.agent_page)}#unit=${u.i}" title="this unit's tokens on the agent trace page">unit ${u.i}</a>` : `unit ${u.i}`} · <b class="${u.decision}">${esc(u.decision)}</b>${u.marks.filter(m => m !== '<|speak|>' && m !== '<|listen|>' || u.decision === 'speak' && m === '<|listen|>').map(m => ' ' + esc(m)).join('')}${u.text.trim() ? ' · “' + esc(u.text.trim()) + '”' : ''}` : '';
  if (uc.innerHTML !== uh) uc.innerHTML = uh;
  const ov = cur.overlaps.reduce((s, [a, b]) => s + Math.max(0, Math.min(b, t) - a), 0);
  $('#ncount').innerHTML = `<span>user talk</span><b>${(talkSoFar('user', t) / 1000).toFixed(1)}s</b><span>agent talk</span><b>${(talkSoFar('agent', t) / 1000).toFixed(1)}s</b>`
    + `<span>overlap</span><b>${(ov / 1000).toFixed(1)}s</b><span>turns</span><b>${cur.turns.filter(x => x.actual.t0 <= t).length}/${cur.turns.length}</b>`;
  syncTranscript(t); syncTicker(t, force);
}

// ---------- boot ----------
$('#q').oninput = renderSidebar;
renderCatFilter();
$('#cases').onclick = e => { const el = e.target.closest('.case'); if (el) selectCase(+el.dataset.i); };
document.addEventListener('keydown', e => {
  if (!cur || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); playing ? stopTimeline() : playTimeline(); return; }
  const times = [...new Set(cur.frames.flatMap(f => isSeg(f.data) ? [f.t, f.data.t0, f.data.t0 + f.data.dur] : [f.t]))].sort((a, b) => a - b);
  if (e.key === 'ArrowRight') { const t = times.find(v => v > cursor); if (t != null) { setCursor(t); scrollTo(t); } }
  if (e.key === 'ArrowLeft') { const t = [...times].reverse().find(v => v < cursor); if (t != null) { setCursor(t); scrollTo(t); } }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const i = CASES.indexOf(cur) + (e.key === 'ArrowDown' ? 1 : -1);
    if (i >= 0 && i < CASES.length) { e.preventDefault(); selectCase(i); }
  }
});
addEventListener('resize', () => { if (cur) renderTimeline(); });
if (CASES.length) {
  const [want, at] = decodeURIComponent(location.hash.slice(1)).split('@');
  selectCase(Math.max(0, CASES.findIndex(c => c.case_id === want)));
  if (at) { setCursor(+at); scrollTo(+at); }
} else renderSidebar();
</script>
</body>
