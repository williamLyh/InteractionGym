<style>
:root {

  --other: #6f6f78; --other-soft: #e9e9ee; --good: #1f8a4c; --bad: #c43d3d; --overlap: rgba(196, 61, 61, .10);

  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
.app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
a.back { display: inline-block; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 6px; }
a.back:hover { color: var(--ink); }
button.playing { background: var(--cursor); border-color: var(--cursor); color: #fff; }
aside h1 { font-size: 14px; margin: 0 0 8px; }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.cases { overflow: auto; flex: 1; }
.case { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.case:hover { background: var(--soft); }
.case.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); }
.case .id { font-weight: 600; word-break: break-all; }
.case .sub { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
main { overflow: auto; padding: 16px 20px 40px; min-width: 0; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 18px; }
.tracebtn { margin-left: auto; align-self: center; font-size: 12px; font-weight: 500; text-decoration: none; color: var(--agent); border: 1px solid var(--agent); border-radius: 6px; padding: 3px 10px; background: var(--agent-soft); }
.tracebtn:hover { filter: brightness(0.96); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip b { font-variant-numeric: tabular-nums; }
.ok { color: var(--good); } .no { color: var(--bad); } .mid { color: var(--mid); }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
section.card > h3 { margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
section.card > h3 .sp { flex: 1; }
.body { padding: 12px 14px; }
button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
button:hover { background: var(--soft); }
.tl { display: grid; grid-template-columns: 150px 1fr; }
.labels { border-right: 1px solid var(--line); position: relative; }
.labels div { position: absolute; left: 0; right: 0; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; font-size: 12px; }
.labels small { color: var(--muted); font-family: var(--mono); font-size: 10.5px; word-break: break-all; }
.scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
svg { display: block; }
svg text { font-size: 11px; fill: var(--ink); }
.axis text { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.axis line { stroke: var(--line); }
.hit { cursor: pointer; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 12px; z-index: 10; display: none; white-space: pre-wrap; }
.tip b { font-family: var(--mono); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } .app { grid-template-columns: 200px 1fr; } }
.state .row { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.state .row:last-child { border-bottom: 0; }
.state .screen img { display: block; max-width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.who { display: inline-block; font-weight: 600; font-size: 11px; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
.who.user { background: var(--user-soft); color: var(--user); } .who.agent { background: var(--agent-soft); color: var(--agent); } .who.other { background: var(--other-soft); color: var(--other); }
.heard { } .unheard { color: var(--muted); opacity: .75; } .unsaid { color: var(--muted); text-decoration: line-through; }
.tag { font-size: 11px; color: var(--muted); margin-left: 6px; }
.cat { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.cat.chitchat { color: var(--other); } .cat.sop { color: var(--mid); } .cat.tool_call { color: var(--user); }
.cats { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.cats button.cat { background: none; cursor: pointer; font: inherit; font-size: 11px; opacity: .45; }
.cats button.cat.on { opacity: 1; font-weight: 600; }
.evsub { font-size: 12px; font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.evsub + .hint, .evdesc { margin-bottom: 8px; }
.evblock + .evblock { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.policy-target { border-left: 3px solid var(--mid); padding: 2px 0 2px 10px; margin: 6px 0 10px; }
.policy-mark { background: color-mix(in srgb, var(--mid) 22%, transparent); color: inherit; border-radius: 2px; }
.tag.cut { color: var(--bad); } .tag.barge { color: var(--cursor); }
.tr { display: grid; grid-template-columns: 118px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tr:hover { background: var(--soft); }
.tr .time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tr.now { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
td.mono { font-family: var(--mono); white-space: nowrap; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--soft); }
tr.future td { opacity: .45; }
table.kv tr { cursor: default; } table.kv tr:hover { background: none; } table.kv td { font-size: 12.5px; }
pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: auto; font: 11.5px/1.45 var(--mono); max-height: 320px; }
.tablewrap { max-height: 420px; overflow: auto; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; }
details.tool { padding: 2px 0; } details.tool:not([open]) summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } details.tool summary { cursor: pointer; } details.tool b { font-family: var(--mono); font-weight: 500; }
.upd { margin: 6px 0; padding-left: 8px; border-left: 2px solid var(--line); }
.play { margin-left: 6px; padding: 0 6px; font-size: 10px; line-height: 16px; }

/* ---------- live playback ---------- */
.ctrl { display: inline-flex; align-items: center; gap: 6px; }
.ctrl select { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 1px 4px; }
.clock { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowbar { display: grid; grid-template-columns: 1fr 1fr minmax(180px, .8fr); gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.party { min-width: 0; }
.party .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 20px; }
.st { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.st.on { color: #fff; } .party.user .st.on { background: var(--user); } .party.agent .st.on { background: var(--agent); }
.st.warn { background: var(--cursor); color: #fff; } .st.bad { background: var(--bad); color: #fff; }
.st.on::before, .st.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.unitchip { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.unitchip b { font-weight: 600; } .unitchip .speak { color: var(--agent); }
.bubble { position: relative; margin-top: 6px; padding: 5px 9px; border-radius: 10px; font-size: 12.5px; min-height: 28px; background: var(--soft); color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.party.user .bubble.on { background: var(--user-soft); color: var(--ink); } .party.agent .bubble.on { background: var(--agent-soft); color: var(--ink); }
.bubble.on::after { content: "▍"; color: var(--cursor); animation: pulse .8s step-end infinite; }
.counters { font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; align-content: start; }
.counters span { color: var(--muted); } .counters b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.headline { padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; min-height: 31px; cursor: pointer; }
.headline .lbl { font: 600 10px var(--mono); letter-spacing: .06em; color: var(--cursor); white-space: nowrap; }
.headline.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--cursor) 22%, transparent); } to { background: transparent; } }
.ticker { max-height: 440px; overflow: auto; }
.hl { display: grid; grid-template-columns: 54px 16px 1fr auto; gap: 6px; align-items: baseline; padding: 5px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.hl:hover { background: var(--soft); }
.hl .tm { font: 11px var(--mono); color: var(--muted); }
.hl .ic { font-weight: 700; text-align: center; } .hl .tx { min-width: 0; }
.hl .meta { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.hl.future { opacity: .45; }
.hl.cur { background: var(--soft); box-shadow: inset 3px 0 0 var(--cursor); opacity: 1; }
.hl.live { opacity: 1; } .hl.live .ic::before { content: "●"; color: var(--cursor); animation: pulse 1s ease-in-out infinite; }
.hl.live .ic span { display: none; }
.hl pre { grid-column: 1 / -1; margin: 4px 0 2px; max-height: 260px; cursor: text; }
.hl .src { font: 10px var(--mono); color: var(--muted); }
.sc { font: 11px var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; }
.sc.ok { color: var(--good); } .sc.no { color: var(--bad); } .sc.mid { color: var(--mid); } .sc.na { color: var(--muted); border-style: dashed; }
.xp { border: 0; background: none; padding: 0 3px; color: var(--muted); font-size: 11px; }
.tally { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.tally .big { font: 600 16px var(--mono); font-variant-numeric: tabular-nums; }
.tally .bar { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; min-width: 80px; }
.tally .bar i { display: block; height: 100%; background: var(--good); transition: width .25s; }
.tr .txt { margin-top: 1px; }
.tr.future .txt { opacity: .55; }
.tr.now .w { opacity: .4; transition: opacity .12s; } .tr.now .w.said { opacity: 1; }
.tr.now .w.cur { opacity: 1; border-radius: 3px; box-shadow: 0 0 0 2px var(--cursor-soft, transparent); background: color-mix(in srgb, var(--cursor) 18%, transparent); }
svg rect.u { opacity: .3; } svg rect.u.past { opacity: .85; } svg rect.u.cur { opacity: 1; stroke: var(--cursor); stroke-width: 2; }
svg text.ut { font: 9.5px var(--mono); fill: var(--ink); pointer-events: none; }
@media (max-width: 900px) { .nowbar { grid-template-columns: 1fr 1fr; } .counters { grid-column: 1 / -1; grid-template-columns: repeat(4, auto 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { overflow: visible; padding: 12px 10px 30px; }
  .tl { grid-template-columns: 78px 1fr; } .labels small { display: none; }
  .nowbar { grid-template-columns: 1fr; } .counters { grid-template-columns: auto 1fr auto 1fr; }
  .tr { grid-template-columns: 1fr; gap: 2px; } .hl { grid-template-columns: 46px 14px 1fr; } .hl .meta { grid-column: 3; }
  section.card > h3 { flex-wrap: wrap; }
}
</style>

94a84c2e02d422a2efb0f331ed36.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3520}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-8ecaee65:4000", "role": "agent", "start_time": 4000, "end_time": 8760, "text": "Yeah, that sounds like a great idea. What trail are you thinking of?", "media": {"kind": "audio", "uri": "media/09/098754cb0244e8200541010fbfc744b693fd4cb06863dc8c2c5ad919e86572ff.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4760}}, {"id": "s1", "role": "user", "start_time": 6635, "end_time": 7255, "text": "mm-hmm", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/6b/6b2919d16dabcefbaa7ca149d8599ca1a0e8708df30d0f3793b68a41c90b1a6b.mp3", "sr": 24000, "start_ms": 0, "end_ms": 620}}, {"id": "u1", "role": "user", "start_time": 11484, "end_time": 17064, "text": "Actually, I haven’t picked one yet. Do you have any recommendations for a moderate hike near Seattle?", "media": {"kind": "audio", "uri": "media/f7/f7ac9ad9e89b4f6cc2b8b6eb511db49ce60613b8064984126a41d5a5db241912.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5580}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-8810d283:18000", "role": "agent", "start_time": 18000, "end_time": 31680, "text": "Sure thing. There's a really nice one called the Skyline Trail in Mount Rainier National Park. It's moderate difficulty and has some amazing views. Have you been there before?", "media": {"kind": "audio", "uri": "media/80/80043d35be74bda3eb5087c28c6473abc000c59f9147fdcbb949f14bf77cbce7.mp3", "sr": 24000, "start_ms": 0, "end_ms": 13680}}, {"id": "s2", "role": "user", "start_time": 28639, "end_time": 29279, "text": "right", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/be/befd18c385fc93779a20edbb56b1ac1d7273a8dba33b9e18011c723c80f283d0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 640}}, {"id": "u2", "role": "user", "start_time": 33066, "end_time": 36886, "text": "I think I’ve heard of it, but I haven’t actually been. How long is the loop?", "media": {"kind": "audio", "uri": "media/ce/ce93bb5279fee7d38295ea0d2c22e4ccf3cf733bc7118a9c47bf527f436f4f60.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3820}}, {"id": "s3", "role": "user", "start_time": 36860, "end_time": 37148, "text": "", "kind": "noise", "expects": "ignore", "label": "cough", "media": {"kind": "audio", "uri": "media/30/30dac29d0c822f6d73efa272e71eac367c5d93b99740b9037ad355e643c47c24.mp3", "sr": 16000, "start_ms": 0, "end_ms": 288}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-835fd09d:38000", "role": "agent", "start_time": 38000, "end_time": 41800, "text": "The loop is about 1 0 miles round trip.", "media": {"kind": "audio", "uri": "media/a8/a85b14f2f6fe435e04411df6f9b3e49908d6b30287de57475391fe0d4096aac6.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3800}}, {"id": "s4", "role": "user", "start_time": 38818, "end_time": 41358, "text": "Yeah, I'm right here, just give me a sec.", "kind": "aside", "expects": "ignore", "media": {"kind": "audio", "uri": "media/4a/4a3ee799a127966cfa1459601773d72175edaaa11febf7054af64d86b52873cd.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2540}}, {"id": "u3", "role": "user", "start_time": 42154, "end_time": 49294, "text": "That’s a bit shorter than I was hoping for. I’m looking for something around eight to twelve kilometres. Do you have another option?", "media": {"kind": "audio", "uri": "media/8c/8c920acd0f7afd886776740376f5e6f9d15e3f721f45f141b28d1d1c01e88529.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7140}}, {"id": "s5", "role": "user", "start_time": 47175, "end_time": 49796, "text": "", "kind": "noise", "expects": "ignore", "label": "dog_bark", "media": {"kind": "audio", "uri": "media/84/84c62373d56140ef3ec08783641ecfde02576ea50cad0dfaf6e3a3a0e2229df9.mp3", "sr": 16000, "start_ms": 0, "end_ms": 2621}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-04aa5fe0:51000", "role": "agent", "start_time": 51000, "end_time": 67720, "text": "How about the Wonderland Trail? That one is much longer, stretching over 9 3 miles if you want to do it all the way around the park. But if you just want a shorter section, there are plenty of options between 8 to 1 2 kilometers.", "media": {"kind": "audio", "uri": "media/a4/a486c5ef1e32cd1ada975de790172f92e9971f556ac6d453f50d75771152f1b9.mp3", "sr": 24000, "start_ms": 0, "end_ms": 16720}}, {"id": "u4", "role": "user", "start_time": 68109, "end_time": 78089, "text": "A full 93-mile loop is definitely too much for a day trip. But do you have a specific section of the Wonderland Trail in mind that fits that 8 to 12-kilometer range?", "media": {"kind": "audio", "uri": "media/9d/9d3d0c1090b09692fd4bfb1b1817331259a89b108dc6244dee6b15d0f68f4018.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9980}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-b37d2a43:80000", "role": "agent", "start_time": 80000, "end_time": 97480, "text": "Yeah, how about starting at Par nassus Sno-Park and heading up to Paradise? That section is roughly 8 to 10 kilo meters one way with incredible mountain views along the way. It's well marked and popular, so you'll have company but still enjoy nature.", "media": {"kind": "audio", "uri": "media/9d/9d6353ac7b496f96a0df31cc1278908cedb5fd67af2f40c164defe9c6a6bd0bc.mp3", "sr": 24000, "start_ms": 0, "end_ms": 17480}}, {"id": "u5", "role": "user", "start_time": 97888, "end_time": 108228, "text": "That sounds perfect, actually. I did a similar hike up to the summit of Rattlesnake Ledge last summer, and I loved the mix of forest and open views. What do you recommend I bring for that trip?", "media": {"kind": "audio", "uri": "media/a3/a34243875fc29e00608b05e5c6388aacc00dffc5f004c6c295089661c0d34f18.mp3", "sr": 24000, "start_ms": 0, "end_ms": 10340}}, {"id": "a:resp-duplex-d8f9ef26753942dd9305d3b13786de08-0-d91c85d5:110000", "role": "agent", "start_time": 110000, "end_time": 120000, "text": "I ’d recommend bringing sturdy hiking shoes, layers since the weather can change quickly, plenty of water, maybe some  "agent", "start_time": 14000, "end_time": 18080, "text": "对啊，博物馆就是普通。", "media": {"kind": "audio", "uri": "media/bf/bf5b536fafbab265e6c3e73922599a165472f8d65e2ca18c4a13f5071afe622d.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4080}}, {"id": "u2", "role": "user", "start_time": 15201, "end_time": 18441, "text": "我最近好像刚去过一个，有点审美疲劳了。", "expects": "yield", "media": {"kind": "audio", "uri": "media/44/44b96feee97ce421475e3b638e621b5d8d977251b1be0b8b155a9172a10c15bd.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3240}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-90767bac:19000", "role": "agent", "start_time": 19000, "end_time": 25600, "text": "哦，那可真累，你去的是什么类的博物馆呢？", "media": {"kind": "audio", "uri": "media/fe/fed8655a0ffad7a68d0d95b33cad90bd61f9a7b779dc8eec78a60005eebff317.mp3", "sr": 24000, "start_ms": 0, "end_ms": 6600}}, {"id": "u3", "role": "user", "start_time": 25928, "end_time": 26788, "text": "就是那种...", "expects": "wait", "media": {"kind": "audio", "uri": "media/a1/a1ec76808cbe9c3c08f7135afa1ceceb130f1d31e3f19875093226ff5355e284.mp3", "sr": 24000, "start_ms": 0, "end_ms": 860}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-dcbd0f38:28000", "role": "agent", "start_time": 28000, "end_time": 30960, "text": "哎，我懂了，", "media": {"kind": "audio", "uri": "media/0e/0e95e6704898d18bf131e0ca30c9e92c2fe2d5f729efe726b9aad40ee604c044.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2960}}, {"id": "u4", "role": "user", "start_time": 28525, "end_time": 30525, "text": "历史类的，看着挺累的。", "expects": "yield", "media": {"kind": "audio", "uri": "media/72/72a4c3811c5f64c4f1c3ac9a5998d8d970b360ac86c88790ee830a36a0379b5a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2000}}, {"id": "u5", "role": "user", "start_time": 31028, "end_time": 34968, "text": "其实我挺想找个能走走路、拍拍照的地方，不用太远的。", "media": {"kind": "audio", "uri": "media/2a/2a2e1c0d465a29948353a293ae8412169ad764f0c5f3d14b7d442117ee4a71f2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3940}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-00e961d0:36000", "role": "agent", "start_time": 36000, "end_time": 39360, "text": "哈哈，公园吧。", "media": {"kind": "audio", "uri": "media/51/51cf6a0d892f4cb0b206c793d7a20ec15beffa8ab8bfd1a6538a12604f7b2730.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3360}}, {"id": "u6", "role": "user", "start_time": 39556, "end_time": 40316, "text": "公园？", "media": {"kind": "audio", "uri": "media/68/68ffe860d85778754df7b4eafb51c0df43fc0ee2f1c879be5cc1947d6071527e.mp3", "sr": 24000, "start_ms": 0, "end_ms": 760}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-6de548ad:41000", "role": "agent", "start_time": 41000, "end_time": 48600, "text": "对啊，比如朝阳公园或者朝阳公园都挺好的。", "media": {"kind": "audio", "uri": "media/1b/1b742cbc2d36377c1d13c97c4622205b5dfe8d7a7ac6723e27f07a47ea7e616b.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7600}}, {"id": "u7", "role": "user", "start_time": 45500, "end_time": 48920, "text": "朝阳公园？那是在北京吧，我在杭州呢。", "expects": "yield", "intent": "correction", "media": {"kind": "audio", "uri": "media/1d/1d4bbc495e3f9e16e07bdf2d4d9bc97e55fde71a6fd75a4e96e4b85d2eb464d0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3420}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-8904ba24:50000", "role": "agent", "start_time": 50000, "end_time": 53880, "text": "哈哈，那杭州也有呀。", "media": {"kind": "audio", "uri": "media/0a/0a80a4220929d970bc30b0685d08fc1e40fa76885e1c3369ca1053f540d6184f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3880}}, {"id": "s1", "role": "user", "start_time": 51209, "end_time": 53309, "text": "妈，你过来看这个设计稿。", "kind": "aside", "expects": "ignore", "media": {"kind": "audio", "uri": "media/5f/5f8a4233de5e11ba72cceb6b859c1ab4b9c04d65bc8ed2b353d37c001bdd5889.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2100}}, {"id": "u8", "role": "user", "start_time": 54497, "end_time": 57317, "text": "西湖我去了太多次了，想换个地方。", "media": {"kind": "audio", "uri": "media/0c/0c780ec4899d55d0b6c4fdd33ca19b21c1f4e271cdc0ce32a595823f514abc7a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2820}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-1f747ddb:58000", "role": "agent", "start_time": 58000, "end_time": 67000, "text": "嗯，那西湖确实美丽，但确实有点老去了。", "media": {"kind": "audio", "uri": "media/92/92f0a6e68708ec13a784b972396d4c5140d1968a0794d26d305d4deb1ecf6d2f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9000}}, {"id": "u9", "role": "user", "start_time": 67242, "end_time": 71282, "text": "对啊，我想找个稍微有点野趣的，能拍点好看照片的。", "media": {"kind": "audio", "uri": "media/40/40f130ec21da6f9c6e117debbbd482b52a8357009d1694ae2c98d39e1b1b5dc2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4040}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-94f133ad:73000", "role": "agent", "start_time": 73000, "end_time": 82880, "text": "嗯，那你不如去一下龙井村，那边有茶园和小溪，风景很自然，拍照特别出片。", "media": {"kind": "audio", "uri": "media/6e/6ec177fee10c191e27f4ef54254105036cb61c7168551087f4e4787dab8222a0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9880}}, {"id": "s2", "role": "user", "start_time": 76467, "end_time": 76947, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/45/4507ec87a3f737a4dbaff30279a4e5837196dea788075f9cd85762e27146142f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 480}}, {"id": "s3", "role": "user", "start_time": 80000, "end_time": 80500, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/8d/8dafc8eda161506b62179afe0c9ad145b93a4d9e13237390757275abed280bfb.mp3", "sr": 24000, "start_ms": 0, "end_ms": 500}}, {"id": "u10", "role": "user", "start_time": 83134, "end_time": 86714, "text": "龙井村？听起来不错诶，那边能走多久呀？", "media": {"kind": "audio", "uri": "media/8a/8a77feb847346692ce628749f4a59a95ff8ad3523479f650bb33deaae64e38ec.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3580}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-4b5afbe8:88000", "role": "agent", "start_time": 88000, "end_time": 95040, "text": "呃，走路的话大概一个小时到一个半小时吧。", "media": {"kind": "audio", "uri": "media/f1/f1405c9ca54c1abfe82590352ab745d2b7dbfe274ebe52eff081b23c2275042a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7040}}, {"id": "u11", "role": "user", "start_time": 95385, "end_time": 101925, "text": "正好，不累又能出片。那就定龙井村啦！对了，你顺便给我推荐部周末在家能追的剧呗？", "media": {"kind": "audio", "uri": "media/c4/c48d67654655158ac61187255b439ef17424bd5ea0bb06d9d48bed7ad2ae1eee.mp3", "sr": 24000, "start_ms": 0, "end_ms": 6540}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-02da36ea:104000", "role": "agent", "start_time": 104000, "end_time": 116640, "text": "哈哈，那你喜欢看古装剧吗？最近有一部叫《长相思》的剧挺火的，剧情还算新颖，适合在家追着放松。", "media": {"kind": "audio", "uri": "media/83/83a1fd11b77d99e47b498edb268fcf4c7798d41dbbe33f60c6e2b2d6bd9293f7.mp3", "sr": 24000, "start_ms": 0, "end_ms": 12640}}, {"id": "s4", "role": "user", "start_time": 110000, "end_time": 110480, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/45/4507ec87a3f737a4dbaff30279a4e5837196dea788075f9cd85762e27146142f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 480}}, {"id": "s5", "role": "user", "start_time": 113250, "end_time": 113750, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/8d/8dafc8eda161506b62179afe0c9ad145b93a4d9e13237390757275abed280bfb.mp3", "sr": 24000, "start_ms": 0, "end_ms": 500}}, {"id": "u12", "role": "user", "start_time": 116796, "end_time": 120000, "text": "《长相思》啊，听着挺有感觉的，那", "unsaid": "就它了！谢啦，周末见！", "media": {"kind": "audio", "uri": "media/6a/6a183a1e1a2eeadd0e003532f263450640e7673a4769a66353d32b0271d88a45.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3204}}], "eval": {"reward": {"total": null, "parts": {}}, "duplex": {"u2": {"behavior": "barge_in", "target": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-30e55f04:14000", "reaction": "yielded", "latency_ms": 2879}, "u4": {"behavior": "barge_in", "target": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-dcbd0f38:28000", "reaction": "kept_talking"}, "u7": {"behavior": "barge_in", "target": "a:resp-duplex-b3987e .done": 7, "response.done": 7, "rate_limits.updated": 7}, "categories": ["chitchat"], "run_id": "minicpmo-suite", "agent_name": "agent", "agent_base": "agent"}, "background": [{"media": {"kind": "audio", "uri": "media/f8/f8c8bbec2cc8d66989f5d6553da5fde7f46d06dbac55ee97b4a3bf0c23fb0f74.mp3", "sr": 24000, "start_ms": 169254, "end_ms": 272254}, "loop": true, "spec": {"type": "ambience:home", "level_dbfs": -52.0, "snr_db": 32.0, "source": "file:soundbank/ambience/home/dwashing.wav", "from": "surroundings", "surroundings": "home"}}], "turns": [{"id": "u0", "role": "user", "start_time": 0, "end_time": 4640, "text": "Afternoon. I've been reading about keeping the mind sharp at my age.", "media": {"kind": "audio", "uri": "media/c4/c447058c8453e2e2b2820b487caa6a55e05b4d20e080768a5668294942100c6c.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4640}}, {"id": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-853b6a60:5000", "role": "agent", "start_time": 5000, "end_time": 10240, "text": "That's a great idea. Keeping your mind active is important as you age.", "media": {"kind": "audio", "uri": "media/f7/f7d2f7fbde2c121ba44a1be629494b2bc72ad347a9d3e1f0ce8dc0b71fc5f11c.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5240}}, {"id": "u1", "role": "user", "start_time": 12964, "end_time": 20184, "text": "Yes, well, I read somewhere that we only use ten percent of our brains, so there’s plenty of room to work on.", "media": {"kind": "audio", "uri": "media/ac/ace607068746d6e20d80daadd8def2e0493c258c002354eb06a095e03b4385c0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7220}}, {"id": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-28fe8307:21000", "role": "agent", "start_time": 21000, "end_time": 29840, "text": "Actually, we use almost all of our brains, even though not every part at the same time. That myth has been around for a long time.", "media": {"kind": "audio", "uri": "media/02/02a6597253aad80b97d3e2c293a750be9364b9b81b228d165571e9ff7a3318de.mp3", "sr": 24000, "start_ms": 0, "end_ms": 8840}}, {"id": "u2", "role": "user", "start_time": 30426, "end_time": 31386, "text": "Oh, really?", "expects": "wait", "media": {"kind": "audio", "uri": "media/aa/aa5e57403184bc63c1b2d38e1101173bd080c7bd7150f4c93a6edbd9aa78ce15.mp3", "sr": 24000, "start_ms": 0, "end_ms": 960}}, {"id": "u3", "role": "user", "start_time": 32967, "end_time": 34000, "text": "I didn't know t", "unsaid": "hat. How do you know that?", "media": {"kind": "audio", "uri": "media/35/35034ad4e9e07caa150ef6981677f83ff6ade0bf1901bb37bbc99bc9165ee2b8.mp3", "sr": 24000, "start_ms": 0, "end_ms": 1033}}, {"id": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-5f308ba3:33000", "role": "agent", "start_time": 33000, "end_time": 38040, "text": "Yeah, studies show that different areas are active during various tasks.", "media": {"kind": "audio", "uri": "media/96/96ce0c3eb8678b3fab4918a54d314e65cbba21a5687ba5f44eca213237fd81aa.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5040}}, {"id": "u4", "role": "user", "start_time": 38394, "end_time": 40074, "text": "I see. So...", "expects": "wait", "media": {"kind": "audio", "uri": "media/b6/b669d54f61901049581837f745fb5241b39de67940cb500e1a3ebcf7e8f0e357.mp3", "sr": 24000, "start_ms": 0, "end_ms": 1680}}, {"id": "u5", "role": "user", "start_time": 41565, "end_time": 43345, "text": "how do you know that for sure?", "media": {"kind": "audio", "uri": "media/b7/b70076fdab4906b8e4cd1338f3d9787f02ee4cd3477c8cee36946c53b0a5010b.mp3", "sr": 24000, "start_ms": 0, "end_ms": 1780}}, {"id": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-e6c030a6:45000", "role": "agent", "start_time": 45000, "end_time": 56000, "text": "Through brain scans like fMRIs, scientists can see which parts light up when we think or move. It's pretty fascinating.", "media": {"kind": "audio", "uri": "media/de/de35fe611606683cd837adf312c7e627af9ef5b0bac4e34913fbd7ef8f97b92b.mp3", "sr": 24000, "start_ms": 0, "end_ms": 11000}}, {"id": "s1", "role": "user", "start_time": 53633, "end_time": 54413, "text": "mm 5608, "text": "Reading and puzzles, that I can do. And talking to people, well, I've got you for that. Thanks for clearing that up. Goodbye.", "media": {"kind": "audio", "uri": "media/79/79bbf465f0fcbf2d7551bc955b57fd69c7b1cad7f7d5d26be959f018f8ef57af.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7920}}, {"id": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-a0515bb3:96000", "role": "agent", "start_time": 96000, "end_time": 99400, "text": "You're welcome. Have a great day. Goodbye.", "media": {"kind": "audio", "uri": "media/4a/4a144e78598a63b467d4abb93e9d8c6303b683733980206af946603c98080714.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3400}}], "eval": {"reward": {"total": null, "parts": {}}, "duplex": {"a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-5f308ba3:33000": {"behavior": "agent_interrupt", "target": "u3"}, "s1": {"behavior": "backchannel", "target": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-e6c030a6:45000", "reaction": "continued"}, "s2": {"behavior": "noise", "reaction": "stayed_silent"}}, "scores": {"events": [{"turn": "u0", "expects": "respond", "outcome": "responded", "latency_ms": 360, "score": 0.997268039236989, "target": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-853b6a60:5000", "resolved_ms": 5000, "user_start_ms": 0, "user_end_ms": 4640}, {"turn": "u1", "expects": "respond", "outcome": "responded", "latency_ms": 816, "score": 0.7924899414403644, "target": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-28fe8307:21000", "resolved_ms": 21000, "user_start_ms": 12964, "user_end_ms": 20184}, {"turn": "u2", "expects": "wait", "outcome": "waited", "score": 1.0, "resolved_ms": 32967, "user_start_ms": 30426, "user_end_ms": 31386}, {"turn": "u3", "expects": "respond", "outcome": "talked_over", "score": 0.0, "target": "a:resp-duplex-bc676ac9dec64bb49b37a6d186e98ab2-0-5f308ba3:33000", "resolved_ms": 33000, "user_start_ms": 32967, "user_end_ms": 34000}, {"turn": "u4", "expects": "wait", "outcome": "waited", "score": 1.0, "resolved_ms": 41565, " 1584e7d24e10b2cb3d4054817ec9-0-007a82cf:39000", "role": "agent", "start_time": 39000, "end_time": 58760, "text": "不是一回事。月食发生时，地球正好在月亮和太阳之间，导致月亮进入地球的影子中。而阴晴圆缺则是因为月亮绕地球运行时，太阳光照角度不同造成的。", "media": {"kind": "audio", "uri": "media/f2/f202bf6603a9961981b779a4d45725ac7a5758d2230e927af7b398883f0bcac0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 19760}}, {"id": "u2", "role": "user", "start_time": 58934, "end_time": 61654, "text": "嗯，讲得清楚。谢了，再见。", "media": {"kind": "audio", "uri": "media/f1/f12083c5f5cc5c6d09673e7d4c4039ea5379e936525a81f01ca801ec5b3f84fc.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2720}}], "eval": {"reward": {"total": null, "parts": {}}, "duplex": {}, "scores": {"events": [{"turn": "u0", "expects": "respond", "outcome": "responded", "latency_ms": 560, "score": 0.9801596942659225, "target": "a:resp-duplex-1ba21584e7d24e10b2cb3d4054817ec9-0-c2958f63:6000", "resolved_ms": 6000, "user_start_ms": 0, "user_end_ms": 5440}, {"turn": "u1", "expects": "respond", "outcome": "responded", "latency_ms": 1242, "score": 0.051173700917091655, "target": "a:resp-duplex-1ba21584e7d24e10b2cb3d4054817ec9-0-007a82cf:39000", "resolved_ms": 39000, "user_start_ms": 32978, "user_end_ms": 37758}, {"turn": "u2", "expects": "respond", "outcome": "censored", "user_start_ms": 58934, "user_end_ms": 61654}], "by_expectation": {"respond": 0.5157}, "total": 0.5157}, "interaction": {"user_turns": 3, "agent_turns": 2, "duration_s": 65.0, "user_turns_per_min": 2.77, "nudges": 0, "repeats": 0, "agent_cut_ins": 0, "user_cut_by_agent": 0, "barge_ins_not_yielded": 0, "completed": true}}}, {"schema": 1, "meta": {"episode_id": "zh-know-breath-xiaoyu-s1", "seed": 1, "media_root": "media", "task": {"id": "zh-know-breath-xiaoyu", "scenario": {"persona": "你在家里写完作业，好奇地问语音助手一些科学问题。回答太长的时候，你会直接插话问下一个问题。", "profile": {"name": "李小雨", "gender": "female", "age": 14, "language": "zh", "occupation": "初中生", "speaking_style": "快、好奇", "backchanneling": "normal", "hesitancy": "low", "surroundings": "home"}, "first_turn": ndings} surroundings"}}]}, "task_id": "zh-know-breath-xiaoyu", "wall_s": 57.97, "agent_events": {"session.created": 1, "session.updated": 1, "input_audio_buffer.speech_started": 1, "response.listen": 31, "debug.unit_tokens": 69, "input_audio_buffer.processed": 68, "response.created": 4, "conversation.item.added": 4, "conversation.item.created": 4, "response.output_item.added": 4, "response.content_part.added": 4, "response.speak": 4, "response.output_audio.delta": 54, "response.output_audio_transcript.delta": 54, "response.output_audio.done": 4, "response.output_audio_transcript.done": 4, "response.content_part.done": 4, "response.output_item.done": 4, "conversation.item.done": 4, "response.done": 4, "rate_limits.updated": 4}, "categories": ["chitchat"], "run_id": "minicpmo-suite", "agent_name": "agent", "agent_base": "agent"}, "background": [{"media": {"kind": "audio", "uri": "media/f8/f8c8bbec2cc8d66989f5d6553da5fde7f46d06dbac55ee97b4a3bf0c23fb0f74.mp3", "sr": 24000, "start_ms": 169254, "end_ms": 238254}, "loop": true, "spec": {"type": "ambience:home", "level_dbfs": -52.0, "snr_db": 32.0, "source": "file:soundbank/ambience/home/dwashing.wav", "from": "surroundings", "surroundings": "home"}}], "turns": [{"id": "u0", "role": "user", "start_time": 0, "end_time": 5600, "text": "问你个问题，为什么冬天呼出来的气是白的呀？", "media": {"kind": "audio", "uri": "media/3f/3fa19068c81f76c15cc54813d6a86d0f08f8133c78cc4e20bfa9b65d89f636a2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5600}}, {"id": "a:resp-duplex-484a90e212704bd2abcb40d38c574b1e-0-67b9c577:6000", "role": "agent", "start_time": 6000, "end_time": 18760, "text": "冬天呼出来的气是白的，其实是因为呼出的水蒸气遇到冷空气凝结成了小水滴或者小冰晶。所以看起来像一团白雾。", "media": {"kind": "audio", "uri": "media/d3/d3b0b352dd267fab29bed6fc3dccf10fda12fa3c227e857783e5b60dc3a7efe9.mp3", "sr": 24000, "start_ms": 0, "end_ms": 12760}}, {"id": "s1", "role": "user", "start_time": 14781, "end_time": 15681, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/b6/b6b1ec041635386bec10e129333e172a50f2317008120dcbc713ddb60ef714d8.mp3", "sr": 24000, "start_ms": 0, "end_ms": 900}}, {"id": "u1", "role": "user", "start_time": 21484, "end_time": 25124, "text": "哦，那夏天为什么看不到呢？", "media": {"kind": "audio", "uri": "media/fd/fd6fd583441c839a6638145129cc4d543bb4ddd046801cefa2868428bf8cc057.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3640}}, {"id": "a:resp-duplex-484a90e212704bd2abcb40d38c574b1e-0-730d4a09:26000", "role": "agent", "start_time": 26000, "end_time": 36840, "text": "夏天空气温度高，你呼出的水蒸气很快就和周围空气达到平衡，不会形成明显的白雾，所以就看不见了。", "media": {"kind": "audio", "uri": "media/6e/6e4fbd26f6cfaeb4ac4e51a752a60298189ab4eafc64b91db1472dc9e4b13862.mp3", "sr": 24000, "start_ms": 0, "end_ms": 10840}}, {"id": "s2", "role": "user", "start_time": 30568, "end_time": 30798, "text": "", "kind": "noise", "expects": "ignore", "label": "dog_bark", "media": {"kind": "audio", "uri": "media/cc/cce9d1e7e9aff883513417e26d8c47ed4b57e57d28e23370295eae9fcfd72fc8.mp3", "sr": 16000, "start_ms": 0, "end_ms": 230}}, {"id": "s3", "role": "user", "start_time": 35000, "end_time": 36120, "text": "哦", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/d8/d848b23bb79974d82d7a2beeab54e3ff12c881c8760051c74d7673fa14ae1475.mp3", "sr": 24000, "start_ms": 0, "end_ms": 1120}}, {"id": "u2", "role": "user", "start_time": 37426, "end_time": 43026, "text": "那冬天戴眼镜进屋为什么会起雾，是不是一个道理？", "media": {"kind": "audio", "uri": "media/60/60d98519775443110ea54a2e1ed65504cf19638f78943b8aba0a2d21e1783bbd.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5600}}, {"id": "a:resp-duplex-484a90e212704bd2abcb40d38c574b1e-0-19bc396a:44000", "role": "agent", "start_time": 44000, "end_time": 58920, "text": "差不多一个道理，镜片外面的空气比屋里的温度低，你进屋后热空气遇到冷镜片也会凝结成水珠。这就是起雾的原因。", "media": {"kind": "audio", "uri": "media/34/342ada9584e22f2cfbb05b6907555db1f16293037a6e51075f71fb9727296ada.mp3", "sr": 24000, "start_ms": 0, "end_ms": 14920}}, {"id": "s4", "role": "user", "start_time": 55467, "end_time": 5 user", "start_time": 13524, "end_time": 23804, "text": "我一般带点青菜和肉。不过我听说隔夜菜都会致癌，一口都不能吃，所以我都是当天做当天带，中午热一下马上吃完。", "media": {"kind": "audio", "uri": "media/46/46f2a8da9dd91e94e43200ea86d02203452b7bdc3dd038a31c19da2289f305a2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 10280}}, {"id": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-59797fdc:25000", "role": "agent", "start_time": 25000, "end_time": 36840, "text": "这个说法不太准确。隔夜菜如果保存得当、加热充分，通常没问题。你只要密封冷藏、彻底热透就行了。", "media": {"kind": "audio", "uri": "media/1e/1e0bba5385fd67344048a9f13e5bf4d07241e2473f1d232953516a799c779d96.mp3", "sr": 24000, "start_ms": 0, "end_ms": 11840}}, {"id": "u2", "role": "user", "start_time": 37426, "end_time": 43486, "text": "啊？真的吗？我还一直以为是常识呢。那为什么以前老说隔夜菜不好啊？", "media": {"kind": "audio", "uri": "media/85/85cd1f8c100d71ce12e033c43abc6e64fa336656e49462c54e547f093493a240.mp3", "sr": 24000, "start_ms": 0, "end_ms": 6060}}, {"id": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-a562dd19:44000", "role": "agent", "start_time": 44000, "end_time": 53520, "text": "主要是担心细菌滋生，比如沙门氏菌或李斯特菌，但只要操作规范就没风险。", "media": {"kind": "audio", "uri": "media/b1/b1800987c9c8e59622180fd5d637a48d6b0b46d8fd55bba1049fe183654f69c0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9520}}, {"id": "u3", "role": "user", "start_time": 53919, "end_time": 59079, "text": "哦，原来是这样，只要保存好就行。那带饭怎么保存才安全？", "media": {"kind": "audio", "uri": "media/12/121de55b9507ca7e9e2f551df429ff6a0ea394f2785ffc26d253372e729792e2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 5160}}, {"id": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-b4ec44c1:60000", "role": "agent", "start_time": 60000, "end_time": 70200, "text": "用密封保鲜盒装好，放在冰箱里冷藏不超过两天。要是吃不完，记得分装少量。", "media": {"kind": "audio", "uri": "media/07/07421b4b11fbdc7e2a4b4fd5483f5d598563293ede84a852e2abe4d6befdef02.mp3", "sr": 24000, "start_ms": 0, "end_ms": 10200}}, {"id": "s2", "role": "user", "start_time": 65500, "end_time": 65960, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/c8/c84564d8ceb749c973aeeeec5b6dd2d92c66576d2b1934e9c0266c8411dab20a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 460}}, {"id": "u4", "role": "user", "start_time": 70311, "end_time": 75091, "text": "好嘞，记住了，密封冷藏别超两天。谢啦，再见！", "media": {"kind": "audio", "uri": "media/d4/d406bd602e42010eac086b25ecaad95340ddec1557847a06f38d28ea398bfcf4.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4780}}, {"id": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-7944086f:76000", "role": "agent", "start_time": 76000, "end_time": 79560, "text": "不客气，慢慢吃饭，注意健康！", "media": {"kind": "audio", "uri": "media/5c/5c6a9bbd9da49070048d52e1c25fda3fcbbfe17fd9bdf059d9da09a008bf7765.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3560}}], "eval": {"reward": {"total": null, "parts": {}}, "duplex": {"s1": {"behavior": "backchannel", "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-a697861e:4000", "reaction": "continued"}, "s2": {"behavior": "backchannel", "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-b4ec44c1:60000", "reaction": "continued"}}, "scores": {"events": [{"turn": "u0", "expects": "respond", "outcome": "responded", "latency_ms": 320, "score": 0.9981670610575072, "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-a697861e:4000", "resolved_ms": 4000, "user_start_ms": 0, "user_end_ms": 3680}, {"turn": "s1", "expects": "ignore", "outcome": "ignored", "score": 1.0, "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-a697861e:4000", "resolved_ms": 9362, "user_start_ms": 8822, "user_end_ms": 9362}, {"turn": "u1", "expects": "respond", "outcome": "responded", "latency_ms": 1196, "score": 0.07871033717053523, "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-59797fdc:25000", "resolved_ms": 25000, "user_start_ms": 13524, "user_end_ms": 23804}, {"turn": "u2", "expects": "respond", "outcome": "responded", "latency_ms": 514, "score": 0.9873828393206613, "target": "a:resp-duplex-183307f207a841c3b5852b25159aabdf-0-a562dd19:44000", "resolved_ms": 44000, "us   const x = t.label === 'called_away' && !t.kind ? '[called away] ' : '';
  return k + x + (t.intent ? '[' + t.intent + '] ' : '');
}
// the episode's always-on background (context, not a turn): from the background tracks, else meta.env.background
function bgSpecs(ep) {
  if (!ep) return [];
  const tracks = (ep.background || []).filter(b => b.spec).map(b => ({spec: b.spec, a: b.start_time || 0, b: b.end_time ?? null}));
  if (tracks.length) return tracks;
  return (((ep.meta || {}).env || {}).background || []).map(spec => ({spec, a: 0, b: null}));
}
function bgLabel(sp) {
  if (sp.type === 'silence') return 'silence';
  const src = (sp.source || '').startsWith('file:') ? 'recording' : (sp.source || '').replace('synthetic:', '') + ' noise';
  return `${sp.type.replace('ambience:', '')} ambience`.replace(/^(white|pink|brown) ambience$/, '$1 noise') + (sp.type.startsWith('ambience:') ? ` (${src})` : '')
    + (sp.level_dbfs != null ? ` · ${sp.level_dbfs} dBFS (SNR ${sp.snr_db} dB)` : '') + (sp.from === 'surroundings' ? ` · from surroundings: ${sp.surroundings}` : '');
}
// word timing for karaoke: the turn's own `words` ([word, start, end] relative to start_time) when recorded,
// else the planned text spread linearly over the planned duration (docs/FORMAT.md §4.3), split where it was cut
function wordTimes(t) {
  const P = segText(t.planned), A = segText(t.actual), out = [];
  if (t.rec && Array.isArray(t.rec.words) && t.rec.words.length) {
    t.rec.words.forEach(([w, a, b]) => out.push({w: w + ' ', s: t.actual.t0 + a, e: t.actual.t0 + b, said: true}));
    const rest = P.slice(A.length).trim();
    if (rest) out.push({w: ' ' + rest, s: Infinity, e: Infinity, said: false});
    return out;
  }
  if (!P) return out;
  const p = t.planned, re = /\S+\s*/g;
  let m;
  while ((m = re.exec(P))) {
    const a = m.index, b = a + m[0].length, at = i => p.t0 + p.dur * i / P.length;
    if (a < A.length && b > A.length) {   // the cut falls inside this word
      out.push({w: P.slice(a, A.length), s: at(a), e: at(A.length), said: true});
      out.push({w: P.slice(A.length, b), s: Infinity, e: Infinity, said: false});
    } else out.push({w: m[0], s: a < A.length ? at(a) : Infinity, e: at(b), said: a < A.length});
  }
  if (P.length && !/^\s/.test(P) && out.length === 0) out.push({w: P, s: p.t0, e: end(p), said: true});
  return out;
}
function idx(seg, t, n = seg.data.length) {
  if (seg.dur <= 0) return t >= seg.t0 ? n : 0;
  return Math.round(n * Math.min(Math.max((t - seg.t0) / seg.dur, 0), 1));
}
const isAudio = d => d && typeof d === 'object' && d.__audio__;
const txt = d => typeof d === 'string' ? d : Array.isArray(d) ? `[${d.length} items]` : isAudio(d) ? `[audio ${fmt(d.dur_ms)}]` : JSON.stringify(d);
const segText = s => s.text != null ? s.text : typeof s.data === 'string' ? s.data : txt(s.data);
const modality = s => isAudio(s.data) ? '🔊 ' : '';
function sliceTxt(d, a, b) { return typeof d === 'string' ? d.slice(a, b) : Array.isArray(d) ? `[${Math.max(0, Math.min(b, d.length) - a)} items]` : ''; }
function summary(d) {
  if (d == null) return '';
  if (d.__video__) return 'frame' + (d.note ? ' after ' + d.note : '');
  if (isSeg(d)) return `seg ${d.id} [${d.t0}–${d.t0 + d.dur}] ${isAudio(d.data) ? txt(d.data) + ' ' : ''}${segText(d)}`;
  if (typeof d === 'object' && d.name && d.arguments) return `${d.name}(${Object.entries(d.arguments).map(([k, v]) => k + '=' + JSON.stringify(v)).join(', ')})  #${d.id}`;
  if (typeof d === 'object' && d.name && 'content' in d) return `${d.error ? '✗ ' : ''}${d.name} → ${d.content}  #${d.id}`;
  const s = typeof d === 'string' ? d : JSON.stringify(d);
  return s.length > 140 ? s.slice(0, 140) + '…' : s;
}

function selectCase(i) {
  stopTimeline();

  linkHash();
  renderSidebar(); renderMain();
}

function linkHash() { history.replaceState(null, '', '#' + encodeURIComponent(cur.case_id) + (cursor ? '@' + cursor : '')); }

let catFilter = null;
function renderCatFilter() {
  const present = [...new Set(CASES.flatMap(c => catsOf(c.episode)))];
  const keys = Object.keys(CATEGORIES).filter(k => present.includes(k)).concat(present.filter(k => !(k in CATEGORIES)));
  $('#catf').innerHTML = keys.length > 1 ? keys.map(k => `<button class="cat ${esc(k)} ${catFilter === k ? 'on' : catFilter ? '' : 'on'}" data-cat="${esc(k)}">${esc(CATEGORIES[k] || k)} ${CASES.filter(c => catsOf(c.episode).includes(k)).length}</button>`).join('') : '';
  document.querySelectorAll('#catf button').forEach(b => b.onclick = () => { catFilter = catFilter === b.dataset.cat ? null : b.dataset.cat; renderCatFilter(); renderSidebar(); });
}
function renderSidebar() {
  const q = $('#q').value.toLowerCase();
  $('#cases').innerHTML = CASES.map((c, i) => {
    prep(c);
    const hay = (c.case_id + ' ' + JSON.stringify(c.meta) + ' ' + JSON.stringify(c.task)).toLowerCase();
    if (q && !hay.includes(q)) return '';
    if (catFilter && !catsOf(c.episode).includes(catFilter)) return '';
    const cuts = c.turns.filter(t => t.cut).length;

      <div class="id">${esc(c.case_id)}</div>

      <span>${c.turns.length} turns</span>${cuts ? `<span class="no">${cuts} cut</span>` : ''}${c.endReason === 'max_duration' ? '<span class="no">truncated</span>' : ''}${duplexScore(c)}</div></div>`;
  }).join('');
}

// meta.agent in the episode header: which agent this is (name, kind, model, server)
function agentHtml(a) {
  if (!a) return '';
  const extra = Object.entries(a).filter(([k]) => !['name', 'kind', 'model', 'server'].includes(k) && typeof a[k] !== 'object' && String(a[k]).length < 60)
    .map(([k, v]) => `${k}=${v}`).join(' · ');
  const tip = [a.model && `model ${a.model}`, a.server && `server ${a.server}`, extra].filter(Boolean).join('\n');
  return `<span class="chip" title="${esc(tip)}">agent <b>${esc(a.name || '?')}</b>${a.kind ? ` · ${esc(a.kind)}` : ''}${a.model && a.model !== a.name ? ` · <span class="hint">${esc(a.model)}</span>` : ''}</span>`;
}

const EXPECTED = {barge_in: 'yield', backchannel: 'continue', aside: 'ignore', noise: 'ignore', away: 'wait (or briefly check in)', agent_interrupt: 'not cut in'};
function verdict(ep, id, d) {
  if (d.behavior === 'barge_in') return d.reaction === 'yielded';
  if (d.behavior === 'agent_interrupt') { const u = ep.turns.find(t => t.id === d.target); return !!(u && u.expects === 'interrupt'); }
  return d.reaction === 'continued' || d.reaction === 'stayed_silent' || d.reaction === 'waited' || d.reaction === 'checked_in';
}
function duplexScore(c) {
  const d = Object.entries(((c.episode || {}).eval || {}).duplex || {});
  if (!d.length) return '';
  const ok = d.filter(([id, x]) => verdict(c.episode, id, x)).length;
  return `<span class="${ok === d.length ? 'ok' : 'no'}">duplex ${ok}/${d.length}</span>`;
}
// pretty: indented JSON; compact: one line per turn / list item (the way docs/format_example.json is laid out)
function trajText(ep, compact) {
  if (!compact) return JSON.stringify(ep, null, 2);
  const dump = (o, ind) => {
    const sp = ' '.repeat(ind);
    if (Array.isArray(o) && o.length && typeof o[0] === 'object' && ind <= 2) return '[\n' + o.map(x => sp + '  ' + JSON.stringify(x)).join(',\n') + '\n' + sp + ']';
    if (o && typeof o === 'object' && !Array.isArray(o) && ind <= 2 && Object.values(o).some(v => v && typeof v === 'object'))
      return '{\n' + Object.entries(o).map(([k, v]) => sp + ' ' + JSON.stringify(k) + ': ' + dump(v, ind + 1)).join(',\n') + '\n' + sp + '}';
    return JSON.stringify(o);
  };
  return dump(ep, 0);
}

function toolHtml(t) {
  return `<details class="tool"><summary><b>${esc(t.name)}</b>${t.service ? ` <span class="tag">${esc(t.service)}</span>` : ''} <span class="hint">${esc(t.description || '')}</span></summary><pre>${esc(JSON.stringify(t.parameters || {}, null, 2))}</pre></details>`;
}
function modelTxt(x) {
  if (!x) return '—';
  return esc(x.model) + (x.params ? ` <span class="hint">${esc(JSON.stringify(x.params))}</span>` : '') + (x.sr ? ` <span class="hint">${x.sr} Hz</span>` : '');
}
function userHtml(c) {

    u.decisions ? row('decisions', Object.entries(u.decisions).filter(([, x]) => x).map(([k, x]) => `<span class="chip">${esc(k)} <b>${x}</b></span>`).join(' ') || '<span class="hint">none</span>') : '',
    u.random_events ? row('random events', Object.entries(u.random_events).filter(([, x]) => x).map(([k, x]) => `<span class="chip">${esc(k)} <b>${x}</b></span>`).join(' ') || '<span class="hint">none</span>') : '',
    u.behaviors ? row('habits', Object.entries(u.behaviors).map(([k, x]) => `<span class="chip">${esc(k)} <b>${esc(typeof x === 'object' && x ? JSON.stringify(x) : x === null ? 'none' : x)}</b></span>`).join(' ')) : '',

// meta.policy.case (spoken SOP tasks, sop_task.py): what the agent could see, and the ground truth of each condition
function caseHtml(p) {
  const k = p.case, src = p.source;
  if (!k || !src) return '';
  const tree = ((src.actions || {})[k.action] || {}).requires, conds = [];
  const walk = n => { if (!n) return; if ('check' in n) conds.push(n); else ['all', 'any', 'chain'].forEach(x => (n[x] || []).forEach(walk)); };
  walk(tree);
  const rows = conds.map(c => { const v = (k.truth || {})[c.check];
    return `<tr><td class="mono">${esc(c.check)}</td><td class="num ${v ? 'ok' : 'no'}" style="font-weight:600">${v ? '✓' : '✗'}</td><td class="hint">${esc(c.by || 'look_up')}</td><td style="white-space:normal">${esc(c.text)}</td></tr>`; }).join('');
  return `<div class="grid2" style="gap:18px;margin:4px 0 10px"><div><div class="hint">what the agent sees (its screen)</div><pre>${esc(k.facts || '')}</pre></div>
    <div><div class="hint">ground truth for this caller — decides whether the action should be done${k.expect ? ' · a correct outcome: ' + esc(JSON.stringify(k.expect)) : ''}</div>
    <div class="tablewrap"><table><thead><tr><th>condition</th><th style="text-align:right">holds</th><th>by</th><th>text</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}

// meta.policy: the procedure (SOP) the agent had to follow; the requested action's own entry first, then the whole text
function policyHtml(c) {
  const p = ((c.episode || {}).meta || {}).policy;
  if (!p) return '';
  // how many actions the agent's SOP covers (the source tree, else SOPBench's "* action:" headers), and where the excerpt sits in it
  const nact = p.source && p.source.actions ? Object.keys(p.source.actions).length : ((p.text || '').match(/^\* \w+:/gm) || []).length;
  const at = p.target && p.text ? p.text.indexOf(p.target) : -1;
  const full = at >= 0 ? esc(p.text.slice(0, at)) + '<mark class="policy-mark">' + esc(p.target) + '</mark>' + esc(p.text.slice(at + p.target.length)) : esc(p.text || '');
  const chips = [p.format && `<span class="chip">format <b>${esc(p.format)}</b></span>`].filter(Boolean).join('');
  return `<section class="card"><h3>SOP policy <span class="hint">meta.policy — the procedure the agent must follow before it acts${p.name ? ' · ' + esc(p.name) : ''}</span></h3><div class="body">
    ${chips ? `<div class="chips" style="margin:0 0 6px">${chips}</div>` : ''}
    ${p.target ? `<div class="hint">this case's action${p.target_action ? ': <b class="mono">' + esc(p.target_action) + '</b>' : ''} — its conditions, excerpted from the full SOP below${nact > 1 ? ' (the agent is not told which action the caller wants)' : ''}</div><pre class="policy-target">${esc(p.target)}</pre>` : ''}
    ${caseHtml(p)}
    ${p.text ? `<details${p.target ? '' : ' open'} ontoggle="const m = this.querySelector('mark'); if (this.open && m) m.parentElement.scrollTop = m.offsetTop - 24"><summary class="hint">the full SOP the agent got${nact ? ' — ' + nact + ' action' + (nact > 1 ? 's' : '') : ''} · ${p.text.length} chars${at >= 0 ? ' · this case\'s action highlighted' : ''}</summary><pre style="max-height:420px;position:relative">${full}</pre></details>` : ''}
    ${p.note ? `<div class="hint" style="margin-top:6px">${esc(p.note)}</div>` : ''}</div></section>`;
}

// meta.sop_judge (sop_task.judge): what the LLM reported, which the rules scored
function judgeHtml(ep) {
  const j = (ep.meta || {}).sop_judge;
  if (!j) return '';
  if (j.error) return `<div class="no" style="margin-bottom:8px">judge failed: ${esc(j.error)}</div>`;
  const r = j.report || {};
  return `<div class="chips" style="margin:0 0 8px"><span class="chip">should <b>${j.should_do ? 'do it' : 'decline'}</b></span><span class="chip">decision <b class="${(r.decision === 'done') === j.should_do && r.decision !== 'unfinished' ? 'ok' : 'no'}">${esc(r.decision || '—')}</b>${r.decision_turn ? ` <span class="hint">at ${esc(r.decision_turn)}</span>` : ''}</span>
    <span class="chip">established before it <b>${(j.established || []).map(esc).join(' → ') || '—'}</b></span>${r.decline_reason ? `<span class="chip">reason given <b>${esc(r.decline_reason)}</b></span>` : ''}${(j.failing || []).length ? `<span class="chip">failing <b>${j.failing.map(esc).join(', ')}</b></span>` : ''}</div>`;
}

function renderEval() {
  const ep = cur.episode, wrap = $('#evalwrap');
  if (!ep || !ep.eval) { wrap.hidden = true; return; }
  const r = ep.eval.reward || {}, dup = Object.entries(ep.eval.duplex || {}), byId = Object.fromEntries(ep.turns.map(t => [t.id, t]));
  const vf = ep.eval.verifier || null, checks = (vf && vf.checks) || {};
  const partCls = v => v === true || v === 1 ? 'ok' : v === false || v === 0 ? 'no' : '';
  const partRows = Object.entries(r.parts || {}).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="num ${partCls(v)}" style="font-weight:600">${v === true ? '✓' : v === false ? '✗' : esc(typeof v === 'number' ? +v.toFixed(3) : v)}</td><td class="hint" style="white-space:normal">${esc(checks[k] || '')}</td></tr>`).join('');
  const content = r.total == null && !vf && !partRows ? '<div class="hint">No content evaluation for this task: it defines no reward and no verifier (open conversation); only the duplex timing below is scored.</div>'
    : `<div class="chips" style="margin:0 0 8px"><span class="chip">reward <b class="${r.total == null ? '' : r.total > 0 ? 'ok' : 'no'}">${r.total ?? '— (not computed)'}</b></span>${vf && vf.name ? `<span class="chip">verifier <b>${esc(vf.name)}</b></span>` : ''}</div>
      ${vf && vf.description ? `<div class="hint evdesc" style="white-space:normal">${esc(vf.description)}</div>` : ''}
      ${judgeHtml(ep)}
      ${partRows ? `<div class="tablewrap"><table><thead><tr><th>check</th><th style="text-align:right">result</th><th>what it checks</th></tr></thead><tbody>${partRows}</tbody></table></div>` : ''}`;
  const group = (keys) => { const xs = dup.filter(([, d]) => keys.includes(d.behavior)); return [xs.filter(([id, d]) => verdict(ep, id, d)).length, xs.length]; };
  const [by, bn] = group(['barge_in']), [ry, rn] = group(['backchannel', 'aside', 'noise', 'away']), ai = dup.filter(([, d]) => d.behavior === 'agent_interrupt').length;
  const stat = (label, y, n) => n ? `<span class="chip">${label} <b class="${y === n ? 'ok' : 'no'}">${y}/${n}</b></span>` : '';
  const rows = dup.map(([id, d]) => {
    const ok = verdict(ep, id, d), t = byId[id] || {}, tg = byId[d.target] || {};
    const snip = s => esc((s || '').slice(0, 42)) + ((s || '').length > 42 ? '…' : '');
    return `<tr data-t="${t.start_time}"><td class="mono">${esc(id)}</td><td>${esc(d.behavior)}</td><td class="mono">${t.start_time}ms</td>
      <td>${snip(t.text) || '<span class="hint">(no words)</span>'}</td><td>${esc(EXPECTED[d.behavior] || '')}</td>
      <td>${d.target ? `<span class="mono">${esc(d.target)}</span> <span class="hint">${snip(tg.text)}</span>` : '<span class="hint">agent silent</span>'}</td>
      <td>${esc(d.reaction || '—')}</td><td class="num">${d.latency_ms != null ? d.latency_ms + 'ms' : ''}</td>
      <td style="font-weight:600" class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</td></tr>`;
  }).join('');
  const sc = ep.eval.scores || null, byT = Object.fromEntries(ep.turns.map(t => [t.id, t]));
  const scoreCls = v => v == null ? '' : v >= 0.8 ? 'ok' : v < 0.5 ? 'no' : '';
  const scoreChips = sc ? `<span class="chip">score <b class="${sc.total == null ? '' : scoreCls(sc.total)}">${sc.total ?? '—'}</b></span>` +
    Object.entries(sc.by_expectation || {}).map(([k, v]) => `<span class="chip">${esc(k)} <b class="${scoreCls(v)}">${v}</b></span>`).join('') : '';
  const scoreRows = sc ? sc.events.map(e => { const t = byT[e.turn] || {};
    return `<tr data-t="${t.start_time}"><td class="mono">${esc(e.turn)}</td><td>${esc(e.expects)}</td><td class="mono">${t.start_time}ms</td>
      <td>${esc((t.text || '').slice(0, 42))}</td><td>${esc(e.outcome)}</td><td class="mono">${esc(e.target || '')}${e.reply ? ` → ${esc(e.reply)}` : ''}</td><td class="num">${e.latency_ms != null ? e.latency_ms + 'ms' : ''}</td>
      <td class="num ${scoreCls(e.score)}" style="font-weight:600">${e.score != null ? e.score.toFixed(2) : '<span class="sc na" title="left out of the means">not scored</span>'}</td></tr>`; }).join('') : '';
  $('#evalcard').innerHTML = `
    <div class="evblock"><div class="evsub">Content <span class="hint" style="font-weight:400">eval.reward · eval.verifier — the task's own check of what was done</span></div>${content}</div>
    <div class="evblock"><div class="evsub">Duplex timing <span class="hint" style="font-weight:400">eval.scores · eval.duplex — rule-based, from the timeline</span></div>
    ${sc ? `<div class="hint" style="margin-bottom:4px">scores — one per user turn: did the agent do what the user expected, and how fast when it took over (rule-based, 0–1; eval.scores; total = mean over the turns)</div>
    <div class="chips" style="margin:0 0 8px">${scoreChips}</div>
    ${sc.events.length ? `<div class="tablewrap" style="max-height:260px;margin-bottom:12px"><table><thead><tr><th>user turn</th><th>user expects</th><th>at</th><th>what the user said</th><th>outcome</th><th>agent turn</th><th style="text-align:right">latency</th><th style="text-align:right">score</th></tr></thead><tbody>${scoreRows}</tbody></table></div>` : ''}
    <div class="hint" style="margin-bottom:4px">special duplex behaviours (eval.duplex)</div>` : ''}
    <div class="chips" style="margin:0 0 10px">
      ${stat('barge-in handled', by, bn)}${stat('rejection correct', ry, rn)}${ai ? `<span class="chip">agent interruptions <b class="no">${ai}</b></span>` : ''}
    </div>
    ${dup.length ? `<div class="tablewrap" style="max-height:260px"><table><thead><tr><th>turn</th><th>behaviour</th><th>at</th><th>what the user did</th><th>expected</th><th>agent turn affected</th><th>reaction</th><th style="text-align:right">latency</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="hint">No special duplex behaviour in this episode (only normal turn-taking).</div>'}</div>`;
  document.querySelectorAll('#evalcard tbody tr').forEach(el => el.onclick = () => { const t = +el.dataset.t; setCursor(t); scrollTo(t); });
  wrap.hidden = false;
}

function setZoom(z, anchorT) {
  const sc = $('#scroll');
  const t = anchorT ?? (sc.scrollLeft + sc.clientWidth / 2) / zoom;
  const offset = anchorT != null ? anchorT * zoom - sc.scrollLeft : sc.clientWidth / 2;
  zoom = Math.min(Math.max(z, 0.005), 5);
  renderTimeline();
  sc.scrollLeft = t * zoom - offset;
}

// ---------- timeline ----------
const PAD = 16, AXIS = 26, SPANS = 50;
function laneY(c) {
  let y = AXIS; const ys = [];
  c.lanes.forEach(l => { ys.push(y); y += l.h; });
  return {ys, spansY: y, H: y + SPANS};
}
function renderTimeline() {
  const c = cur, sc = $('#scroll');
  if (zoom == null) zoom = Math.max((sc.clientWidth - 2 * PAD - 140) / c.tMax, 0.005);
  const X = t => PAD + t * zoom, W = X(c.tMax) + PAD + 140; // room for trailing labels
  c.lanes.filter(l => l.kind === 'envtool').forEach(l => {   // tools offered at the same moment stack up
    const byT = {};
    l.items.forEach((it, i) => { it.idx = i; it.row = (byT[it.t] = (byT[it.t] ?? -1) + 1); });
    l.h = 12 + Math.max(...Object.values(byT).map(n => n + 1)) * 20;
  });
  c.lanes.filter(l => l.kind === 'tool').forEach(l => {   // stack calls so that labels never collide
    const rowEnd = [];
    l.calls.forEach(k => {
      const a = k.call.data, args = Object.entries(a.arguments).map(([n, v]) => n + '=' + JSON.stringify(v)).join(', ');
      const err = k.res && k.res.data.error;
      let lab = `${err ? '✗ ' : ''}${a.name}(${args})`;
      if (lab.length > 64) lab = lab.slice(0, 64) + '…)';
      k.label = lab + (k.t1 == null ? '  (no result)' : `  ${fmt(k.t1 - k.t0)}`);
      const x0 = X(k.t0), x1 = Math.max(k.t1 == null ? X(c.tMax) : X(k.t1), x0 + 6), lw = k.label.length * 6.2 + 12;
      k.inside = x1 - x0 >= Math.min(lw, 90); // the bar's width is the tool latency; short calls cannot hold their label
      const right = k.inside ? x1 : x1 + lw;
      let r = rowEnd.findIndex(e => e < x0 - 8);
      if (r < 0) r = rowEnd.length;
      rowEnd[r] = right; k.row = r;
    });
    l.h = 12 + Math.max(rowEnd.length, 1) * 22;
  });
  const {ys, spansY, H} = laneY(c);
  const col = r => `var(--${r})`, soft = r => `var(--${r}-soft)`;
  let s = `<svg width="${W}" height="${H}" id="svg">`;
  // axis
  const steps = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 60000, 120000, 300000];
  const step = steps.find(v => v * zoom >= 70) || steps[steps.length - 1];
  s += '<g class="axis">';
  for (let t = 0; t <= c.tMax; t += step) s += `<line x1="${X(t)}" x2="${X(t)}" y1="${AXIS - 6}" y2="${H}" /><text x="${X(t) + 3}" y="${AXIS - 10}">${fmt(t)}</text>`;
  s += '</g>';
  // lane backgrounds
  c.lanes.forEach((l, k) => { if (k % 2) s += `<rect x="0" y="${ys[k]}" width="${W}" height="${l.h}" fill="var(--soft)" opacity=".5"/>`; });
  // overlaps
  const segYs = c.lanes.map((l, k) => l.kind === 'seg' ? ys[k] : null).filter(v => v != null);
  if (segYs.length) {
    const y0 = Math.min(...segYs), y1 = Math.max(...c.lanes.map((l, k) => l.kind === 'seg' ? ys[k] + l.h : 0));
    c.overlaps.forEach(([a, b]) => { s += `<rect x="${X(a)}" y="${y0}" width="${Math.max((b - a) * zoom, 1)}" height="${y1 - y0}" fill="var(--overlap)"><title>overlap ${fmt(b - a)}</title></rect>`; });
  }
  let clip = 0;
  c.lanes.forEach((l, k) => {
    const y = ys[k];
    if (l.kind === 'seg') {
      l.turns.forEach(t => {
        const p = t.planned, a = t.actual, py = y + 9, ph = l.h - 18;
        const ax = X(a.t0), aw = Math.max(a.dur * zoom, 2), pw = Math.max(p.dur * zoom, 2);
        s += `<rect x="${X(p.t0)}" y="${py}" width="${pw}" height="${ph}" rx="5" fill="none" stroke="${col(t.role)}" stroke-dasharray="4 3" opacity=".55"/>`;
        s += `<rect class="hit" data-turn="${t.stream}|${t.id}" x="${ax}" y="${py}" width="${aw}" height="${ph}" rx="5" fill="${soft(t.role)}" stroke="${col(t.role)}"/>`;
        const id = 'c' + (clip++);
        s += `<clipPath id="${id}"><rect x="${X(p.t0) + 4}" y="${py}" width="${Math.max(pw - 8, 0)}" height="${ph}"/></clipPath>`;
        const spoken = segText(a), rest = segText(p).slice(spoken.length);
        s += `<text clip-path="url(#${id})" x="${ax + 6}" y="${py + ph / 2 + 4}" pointer-events="none"><tspan>${esc(modality(a) + tagOf(t) + spoken)}</tspan>${rest ? `<tspan fill="var(--muted)" text-decoration="line-through">${esc(rest)}</tspan>` : ''}</text>`;
        if (t.cut) {
          const lab = t.causeLabel || 'cut', c2 = t.cause && t.causeOk ? 'var(--cursor)' : 'var(--bad)';
          s += `<line x1="${X(end(a))}" x2="${X(end(a))}" y1="${py - 5}" y2="${py + ph + 5}" stroke="${c2}" stroke-width="2"/><text x="${X(end(a)) + 3}" y="${py - 1}" style="fill:${c2};font-size:10px">${esc(lab)}</text>`;
        }
      });
    } else if (l.kind === 'units') {
      const w = Math.max(l.units[0] ? (l.units[0].t1 - l.units[0].t0) * zoom - 1.5 : 2, 1.5), cy = y + 4, ch = l.h - 8;
      l.units.forEach((u, j) => {
        const x = X(u.t0) + .75, fill = u.decision === 'speak' ? 'var(--agent)' : u.decision === 'listen' ? 'var(--listen)' : 'var(--user)';
        s += `<rect class="hit u" data-unit="${j}" x="${x}" y="${cy}" width="${w}" height="${ch}" rx="2" fill="${fill}"/>`;
        if (u.marks.includes('<|turn_eos|>')) s += `<path d="M${x + w - 6} ${cy} h6 v6 Z" fill="var(--bad)" pointer-events="none"><title>turn_eos</title></path>`;
        if (u.decision === 'speak' && u.marks.includes('<|listen|>')) s += `<circle cx="${x + w - 3}" cy="${cy + ch - 3}" r="2.2" fill="var(--ink)" pointer-events="none"/>`;
        if (w > 28 && u.text.trim()) s += `<clipPath id="uc${j}"><rect x="${x + 2}" y="${cy}" width="${w - 4}" height="${ch}"/></clipPath><text class="ut" clip-path="url(#uc${j})" x="${x + 3}" y="${cy + ch / 2 + 3.5}">${esc(u.text.trim())}</text>`;
      });
    } else if (l.kind === 'bg') {
      l.items.forEach(it => {
        const x0 = X(it.a), x1 = X(it.b == null ? c.tMax : it.b), lab = bgLabel(it.spec), silent = it.spec.type === 'silence';
        s += `<rect x="${x0}" y="${y + 5}" width="${Math.max(x1 - x0, 2)}" height="${l.h - 10}" rx="4" fill="${silent ? 'none' : 'var(--other-soft)'}" stroke="var(--other)" ${silent ? 'stroke-dasharray="3 3"' : ''}><title>${esc(JSON.stringify(it.spec))}</title></rect>`
          + `<text x="${x0 + 6}" y="${y + l.h / 2 + 4}" pointer-events="none" style="fill:var(--muted);font-size:10.5px">${esc(lab)}</text>`;
      });
    } else if (l.kind === 'envtool') {
      l.items.forEach(it => {
        const ps = Object.keys((it.tool.parameters || {}).properties || {}), lab = `${it.tool.name}(${ps.join(', ')})`;
        const x = X(it.t), by = y + 6 + it.row * 20, w = lab.length * 6.2 + 14;
        s += `<g class="hit" data-envtool="${it.idx}"><rect x="${x}" y="${by}" width="${w}" height="16" rx="8" fill="var(--soft)" stroke="var(--other)"/>`
          + `<text x="${x + 7}" y="${by + 12}" style="font-family:var(--mono);font-size:10.5px">${esc(lab)}</text></g>`;
      });
    } else if (l.kind === 'tool') {
      l.calls.forEach(k => {
        const x0 = X(k.t0), x1 = k.t1 == null ? X(c.tMax) : X(k.t1), err = k.res && k.res.data.error;
        const color = err ? 'var(--bad)' : col(l.role), by = y + 8 + k.row * 22, bh = 16;
        s += `<rect class="hit" data-tool="${c.tools.indexOf(k)}" x="${x0}" y="${by}" width="${Math.max(x1 - x0, 6)}" height="${bh}" rx="4" fill="${err ? 'var(--overlap)' : soft(l.role)}" stroke="${color}" ${k.t1 == null ? 'stroke-dasharray="4 3"' : ''}/>`;
        const cid = 'tc' + c.tools.indexOf(k);
        if (k.inside) s += `<clipPath id="${cid}"><rect x="${x0 + 3}" y="${by}" width="${Math.max(x1 - x0 - 6, 0)}" height="${bh}"/></clipPath>`;
        s += `<text ${k.inside ? `clip-path="url(#${cid})"` : ''} x="${k.inside ? x0 + 6 : Math.max(x1, x0 + 6) + 6}" y="${by + bh / 2 + 4}" pointer-events="none" style="fill:${k.inside ? 'var(--ink)' : color};font-size:10.5px">${esc(k.label)}</text>`;
      });
    } else {
      l.frames.forEach(f => {
        const x = X(f.t), cy = y + l.h / 2, color = f.stream === 'reward' ? 'var(--good)' : f.stream === 'done' ? 'var(--ink)' : 'var(--other)';
        if (f.dur > 0) s += `<rect x="${x}" y="${cy - 5}" width="${Math.max(f.dur * zoom, 2)}" height="10" rx="3" fill="var(--other-soft)" stroke="${color}"/>`;
        s += `<path class="hit" data-frame="${f.i}" d="M${x} ${cy - 6} L${x + 6} ${cy} L${x} ${cy + 6} L${x - 6} ${cy} Z" fill="${color}"/>`;
        const lab = f.stream === 'done' ? 'done' : summary(f.data);
        if (lab) s += `<text x="${x + 9}" y="${cy + 4}" pointer-events="none" style="fill:var(--muted);font-size:10.5px">${esc(lab.length > 40 ? lab.slice(0, 40) + '…' : lab)}</text>`;
      });
    }
  });
  // latency spans
  c.spans.forEach((sp, j) => {
    if (sp.kind !== 'response' && sp.kind !== 'yield') {   // backchannel / aside / noise / agent_interrupt
      const good = ['continued', 'stayed_silent', 'waited', 'checked_in'].includes(sp.reaction), y = spansY + 38;
      const color = sp.kind === 'agent_interrupt' ? 'var(--bad)' : good ? 'var(--good)' : 'var(--bad)';
      s += `<circle class="hit" data-span="${j}" cx="${X(sp.t0)}" cy="${y}" r="4" fill="${color}"/><text x="${X(sp.t0) + 7}" y="${y + 4}" style="fill:${color};font-size:10.5px">${sp.kind}${sp.reaction ? ' → ' + sp.reaction : ''}</text>`;
      return;
    }
    const y = spansY + (sp.kind === 'response' ? 10 : 24), color = sp.kind === 'response' ? 'var(--good)' : 'var(--cursor)';
    if (sp.t1 == null && sp.censored) {   // eval.scores: the episode ended before the answer window closed
      s += `<circle class="hit" data-span="${j}" cx="${X(sp.t0)}" cy="${y}" r="4" fill="var(--muted)"/><text x="${X(sp.t0) + 7}" y="${y + 4}" style="fill:var(--muted);font-size:10.5px">cut off · not scored</text>`;
    } else if (sp.t1 == null) {
      s += `<circle class="hit" data-span="${j}" cx="${X(sp.t0)}" cy="${y}" r="4" fill="var(--bad)"/><text x="${X(sp.t0) + 7}" y="${y + 4}" style="fill:var(--bad);font-size:10.5px">${sp.kind === 'yield' ? 'never yields' : 'no reply'}</text>`;
    } else {
      const x0 = X(sp.t0), x1 = X(sp.t1);
      s += `<g class="hit" data-span="${j}"><line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="2"/><line x1="${x0}" x2="${x0}" y1="${y - 4}" y2="${y + 4}" stroke="${color}" stroke-width="2"/><line x1="${x1}" x2="${x1}" y1="${y - 4}" y2="${y + 4}" stroke="${color}" stroke-width="2"/></g>`;
      s += `<text x="${x1 + 4}" y="${y + 4}" style="fill:${color};font-size:10.5px">${sp.kind} ${fmt(sp.ms)}</text>`;
    }
  });
  s += `<line id="cur" x1="${X(cursor)}" x2="${X(cursor)}" y1="${AXIS - 6}" y2="${H}" stroke="var(--cursor)" stroke-width="1.5"/>`;
  s += '</svg>';
  const keep = sc.scrollLeft;
  sc.innerHTML = s; sc.scrollLeft = keep;
  $('#labels').style.height = H + 'px';
  $('#labels').innerHTML = c.lanes.map((l, k) => `<div style="top:${ys[k]}px;height:${l.h}px"><span><span class="who ${l.role}">${l.kind === 'envtool' ? 'env tools' : l.kind === 'bg' ? 'background' : l.kind === 'tool' ? l.role + ' tools' : l.kind === 'units' ? 'units' : l.role === 'other' ? (l.kind === 'ev' ? 'event' : 'stream') : l.role}</span>${l.kind === 'units' && c.view.agent_page ? ` <a href="${esc(c.view.agent_page)}" title="the agent server's tokens per unit" style="font-size:11px;color:var(--muted)">tokens↗</a>` : ''}</span><small>${esc(l.stream)}</small></div>`).join('')
    + `<div style="top:${spansY}px;height:${SPANS}px"><small>latency · duplex</small></div>`;
  const svg = $('#svg');
  // click or drag anywhere on the timeline to scrub; playback pauses while dragging and resumes after
  let drag = null;
