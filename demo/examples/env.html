        const pre = el.querySelector('pre');
        if (pre) { pre.remove(); e.target.textContent = '▸'; }
        else { el.insertAdjacentHTML('beforeend', `<pre>${esc(h.source)} · resolved at ${h.t_resolved}ms\n${esc(JSON.stringify(h.raw, null, 2))}</pre>`); e.target.textContent = '▾'; }
        return;
      }
      setCursor(h.t); scrollTo(h.t);
    };
  });
  cur._tallyKey = null;
}
function syncTicker(t, force) {
  const hs = cur.headlines;
  if (!hs.length) { $('#nhead').innerHTML = '<span class="lbl">EVENTS</span><span class="hint">none recorded</span>'; return; }
  // the current headline: the last one whose outcome is visible by t
  let last = null;
  hs.forEach(h => { if (h.t_resolved <= t) last = h; });
  let focus = null;
  (cur._hl || []).forEach(r => {
    const h = r.h, st = h === last ? 'cur' : h.t_resolved <= t ? 'past' : h.t <= t ? 'live' : 'future';
    if (st !== r.st) { r.el.classList.remove(r.st); r.el.classList.add(st); r.st = st; }
    if (st === 'cur') focus = r.el;
  });
  if (focus && playing) {
    const box = $('#ticker'), top = focus.offsetTop - box.offsetTop;
    if (top < box.scrollTop || top + focus.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = top - box.clientHeight / 2;
  }
  // the headline line in the timeline card
  const liveH = hs.filter(h => h.t <= t && t < h.t_resolved).pop();
  const show = liveH && (!last || liveH.t > last.t_resolved) ? liveH : last;
  if (show !== lastHl || force) {
    const flash = playing && show && show !== lastHl;
    lastHl = show;
    const el = $('#nhead');
    el.innerHTML = show ? `<span class="lbl">${show === liveH ? 'NOW' : 'LATEST'} · ${(show.t / 1000).toFixed(1)}s</span><span class="${show === liveH ? '' : show.ok === true ? 'ok' : show.ok === false ? 'no' : ''}">${esc(show === liveH ? show.pending : show.text)}</span>${show !== liveH ? scChip(show) : ''}`
      : '<span class="lbl">EVENTS</span><span class="hint">nothing evaluated yet — press ▶ or scrub</span>';
    if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  // running tally: eval.scores.total over the events resolved so far (precomputed per headline)
  const done = hs.filter(h => h.t_resolved <= t), key = done.length;
  if (key === cur._tallyKey && !force) return;
  cur._tallyKey = key;
  const scored = hs.filter(h => h.score != null), sd = done.filter(h => h.score != null);
  const ok = done.filter(h => h.ok === true).length, bad = done.filter(h => h.ok === false).length;
  const unscored = done.filter(h => h.source === 'eval.scores' && h.score == null).length;
  const tally = sd.length ? sd[sd.length - 1].tally : null, total = cur.view.total;
  const by = {};
  sd.forEach(h => (by[h.expects] = by[h.expects] || []).push(h.score));
  $('#tally').innerHTML = hs.some(h => h.source === 'eval.scores')
    ? `<span class="hint">score so far</span><span class="big ${tally == null ? '' : scoreCls(tally)}">${tally == null ? '—' : tally.toFixed(2)}</span>
       <span class="bar" title="events resolved"><i style="width:${scored.length ? 100 * sd.length / scored.length : 0}%"></i></span>
       <span class="hint">${sd.length}/${scored.length} user turns · <span class="ok">${ok} ✓</span> <span class="no">${bad} ✗</span>${unscored ? ` · <span title="cut off by the episode end; left out of the score, as in eval.scores">${unscored} not scored</span>` : ''} · final <b>${total == null ? '—' : total}</b></span>
       <span style="flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap">${Object.entries(by).map(([k, v]) => { const m = v.reduce((a, b) => a + b, 0) / v.length; return `<span class="chip" style="padding:0 8px">${esc(k)} <b class="${scoreCls(m)}">${m.toFixed(2)}</b> <span class="hint">×${v.length}</span></span>`; }).join('')}</span>`
    : `<span class="hint">duplex events</span><span class="big">${ok}✓ ${bad}✗</span><span class="hint">${done.length}/${hs.length} passed · no eval.scores in this episode, so no score</span>`;
}
function syncUnits(t) {
  const ua = unitAt(t);
  if (!ua) return null;
  if (!cur._uel || !cur._uel[0] || !cur._uel[0].isConnected) { cur._uel = [...document.querySelectorAll('#svg rect.u')]; cur._uk = null; }
  const key = ua.k + ':' + !!ua.u;
  if (key !== cur._uk) {
    cur._uk = key;
    cur._uel.forEach((el, i) => { el.classList.toggle('past', i < ua.k || (i === ua.k && !ua.u)); el.classList.toggle('cur', i === ua.k && !!ua.u); });
  }
  return ua.u;
}
function syncLive(t, force) {
  if (!cur || !$('#nowbar')) return;
  const endT = cur.t_end || cur.tMax;
  $('#clock').textContent = `${(t / 1000).toFixed(1)} / ${(endT / 1000).toFixed(1)} s`;
  const {U, A} = partyNow(t);
  setSt('#nu-st', U.st, U.cls); setBubble('#nu-b', U.bubble, U.live);
  setSt('#na-st', A.st, A.cls); setBubble('#na-b', A.bubble, A.live);
  const u = syncUnits(t), uc = $('#na-u');
  const uh = u ? `${cur.view.agent_page ? `<a href="${esc(cur.view.agent_page)}#unit=${u.i}" title="this unit's tokens on the agent trace page">unit ${u.i}</a>` : `unit ${u.i}`} · <b class="${u.decision}">${esc(u.decision)}</b>${u.marks.filter(m => m !== '<|speak|>' && m !== '<|listen|>' || u.decision === 'speak' && m === '<|listen|>').map(m => ' ' + esc(m)).join('')}${u.text.trim() ? ' · “' + esc(u.text.trim()) + '”' : ''}` : '';
  if (uc.innerHTML !== uh) uc.innerHTML = uh;
  const ov = cur.overlaps.reduce((s, [a, b]) => s + Math.max(0, Math.min(b, t) - a), 0);
  $('#ncount').innerHTML = `<span>user talk</span><b>${(talkSoFar('user', t) / 1000).toFixed(1)}s</b><span>agent talk</span><b>${(talkSoFar('agent', t) / 1000).toFixed(1)}s</b>`
    + `<span>overlap</span><b>${(ov / 1000).toFixed(1)}s</b><span>turns</span><b>${cur.turns.filter(x => x.actual.t0 <= t).length}/${cur.turns.length}</b>`;
  syncTranscript(t); syncTicker(t, force);
}

// ---------- boot ----------
$('#q').oninput = renderSidebar;
renderCatFilter();
$('#cases').onclick = e => { const el = e.target.closest('.case'); if (el) selectCase(+el.dataset.i); };
document.addEventListener('keydown', e => {
  if (!cur || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); playing ? stopTimeline() : playTimeline(); return; }
  const times = [...new Set(cur.frames.flatMap(f => isSeg(f.data) ? [f.t, f.data.t0, f.data.t0 + f.data.dur] : [f.t]))].sort((a, b) => a - b);
  if (e.key === 'ArrowRight') { const t = times.find(v => v > cursor); if (t != null) { setCursor(t); scrollTo(t); } }
  if (e.key === 'ArrowLeft') { const t = [...times].reverse().find(v => v < cursor); if (t != null) { setCursor(t); scrollTo(t); } }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const i = CASES.indexOf(cur) + (e.key === 'ArrowDown' ? 1 : -1);
    if (i >= 0 && i < CASES.length) { e.preventDefault(); selectCase(i); }
  }
});
addEventListener('resize', () => { if (cur) renderTimeline(); });
if (CASES.length) {
  const [want, at] = decodeURIComponent(location.hash.slice(1)).split('@');
  selectCase(Math.max(0, CASES.findIndex(c => c.case_id === want)));
  if (at) { setCursor(+at); scrollTo(+at); }
} else renderSidebar();
</script>
</body>
</html>
