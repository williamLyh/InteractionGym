看着挺累的。", "expects": "yield", "media": {"kind": "audio", "uri": "media/72/72a4c3811c5f64c4f1c3ac9a5998d8d970b360ac86c88790ee830a36a0379b5a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2000}}, {"id": "u5", "role": "user", "start_time": 31028, "end_time": 34968, "text": "其实我挺想找个能走走路、拍拍照的地方，不用太远的。", "media": {"kind": "audio", "uri": "media/2a/2a2e1c0d465a29948353a293ae8412169ad764f0c5f3d14b7d442117ee4a71f2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3940}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-00e961d0:36000", "role": "agent", "start_time": 36000, "end_time": 39360, "text": "哈哈，公园吧。", "media": {"kind": "audio", "uri": "media/51/51cf6a0d892f4cb0b206c793d7a20ec15beffa8ab8bfd1a6538a12604f7b2730.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3360}}, {"id": "u6", "role": "user", "start_time": 39556, "end_time": 40316, "text": "公园？", "media": {"kind": "audio", "uri": "media/68/68ffe860d85778754df7b4eafb51c0df43fc0ee2f1c879be5cc1947d6071527e.mp3", "sr": 24000, "start_ms": 0, "end_ms": 760}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-6de548ad:41000", "role": "agent", "start_time": 41000, "end_time": 48600, "text": "对啊，比如朝阳公园或者朝阳公园都挺好的。", "media": {"kind": "audio", "uri": "media/1b/1b742cbc2d36377c1d13c97c4622205b5dfe8d7a7ac6723e27f07a47ea7e616b.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7600}}, {"id": "u7", "role": "user", "start_time": 45500, "end_time": 48920, "text": "朝阳公园？那是在北京吧，我在杭州呢。", "expects": "yield", "intent": "correction", "media": {"kind": "audio", "uri": "media/1d/1d4bbc495e3f9e16e07bdf2d4d9bc97e55fde71a6fd75a4e96e4b85d2eb464d0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3420}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-8904ba24:50000", "role": "agent", "start_time": 50000, "end_time": 53880, "text": "哈哈，那杭州也有呀。", "media": {"kind": "audio", "uri": "media/0a/0a80a4220929d970bc30b0685d08fc1e40fa76885e1c3369ca1053f540d6184f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3880}}, {"id": "s1", "role": "user", "start_time": 51209, "end_time": 53309, "text": "妈，你过来看这个设计稿。", "kind": "aside", "expects": "ignore", "media": {"kind": "audio", "uri": "media/5f/5f8a4233de5e11ba72cceb6b859c1ab4b9c04d65bc8ed2b353d37c001bdd5889.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2100}}, {"id": "u8", "role": "user", "start_time": 54497, "end_time": 57317, "text": "西湖我去了太多次了，想换个地方。", "media": {"kind": "audio", "uri": "media/0c/0c780ec4899d55d0b6c4fdd33ca19b21c1f4e271cdc0ce32a595823f514abc7a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 2820}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-1f747ddb:58000", "role": "agent", "start_time": 58000, "end_time": 67000, "text": "嗯，那西湖确实美丽，但确实有点老去了。", "media": {"kind": "audio", "uri": "media/92/92f0a6e68708ec13a784b972396d4c5140d1968a0794d26d305d4deb1ecf6d2f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9000}}, {"id": "u9", "role": "user", "start_time": 67242, "end_time": 71282, "text": "对啊，我想找个稍微有点野趣的，能拍点好看照片的。", "media": {"kind": "audio", "uri": "media/40/40f130ec21da6f9c6e117debbbd482b52a8357009d1694ae2c98d39e1b1b5dc2.mp3", "sr": 24000, "start_ms": 0, "end_ms": 4040}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-94f133ad:73000", "role": "agent", "start_time": 73000, "end_time": 82880, "text": "嗯，那你不如去一下龙井村，那边有茶园和小溪，风景很自然，拍照特别出片。", "media": {"kind": "audio", "uri": "media/6e/6ec177fee10c191e27f4ef54254105036cb61c7168551087f4e4787dab8222a0.mp3", "sr": 24000, "start_ms": 0, "end_ms": 9880}}, {"id": "s2", "role": "user", "start_time": 76467, "end_time": 76947, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/45/4507ec87a3f737a4dbaff30279a4e5837196dea788075f9cd85762e27146142f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 480}}, {"id": "s3", "role": "user", "start_time": 80000, "end_time": 80500, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/8d/8dafc8eda161506b62179afe0c9ad145b93a4d9e13237390757275abed280bfb.mp3", "sr": 24000, "start_ms": 0, "end_ms": 500}}, {"id": "u10", "role": "user", "start_time": 83134, "end_time": 86714, "text": "龙井村？听起来不错诶，那边能走多久呀？", "media": {"kind": "audio", "uri": "media/8a/8a77feb847346692ce628749f4a59a95ff8ad3523479f650bb33deaae64e38ec.mp3", "sr": 24000, "start_ms": 0, "end_ms": 3580}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-4b5afbe8:88000", "role": "agent", "start_time": 88000, "end_time": 95040, "text": "呃，走路的话大概一个小时到一个半小时吧。", "media": {"kind": "audio", "uri": "media/f1/f1405c9ca54c1abfe82590352ab745d2b7dbfe274ebe52eff081b23c2275042a.mp3", "sr": 24000, "start_ms": 0, "end_ms": 7040}}, {"id": "u11", "role": "user", "start_time": 95385, "end_time": 101925, "text": "正好，不累又能出片。那就定龙井村啦！对了，你顺便给我推荐部周末在家能追的剧呗？", "media": {"kind": "audio", "uri": "media/c4/c48d67654655158ac61187255b439ef17424bd5ea0bb06d9d48bed7ad2ae1eee.mp3", "sr": 24000, "start_ms": 0, "end_ms": 6540}}, {"id": "a:resp-duplex-b3987ec6e01f44c3a768aa49556fbc38-0-02da36ea:104000", "role": "agent", "start_time": 104000, "end_time": 116640, "text": "哈哈，那你喜欢看古装剧吗？最近有一部叫《长相思》的剧挺火的，剧情还算新颖，适合在家追着放松。", "media": {"kind": "audio", "uri": "media/83/83a1fd11b77d99e47b498edb268fcf4c7798d41dbbe33f60c6e2b2d6bd9293f7.mp3", "sr": 24000, "start_ms": 0, "end_ms": 12640}}, {"id": "s4", "role": "user", "start_time": 110000, "end_time": 110480, "text": "嗯", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/45/4507ec87a3f737a4dbaff30279a4e5837196dea788075f9cd85762e27146142f.mp3", "sr": 24000, "start_ms": 0, "end_ms": 480}}, {"id": "s5", "role": "user", "start_time": 113250, "end_time": 113750, "text": "对", "kind": "backchannel", "expects": "ignore", "media": {"kind": "audio", "uri": "media/8d/8dafc8eda161506b62179afe0c9ad145b93a4d9e13237390757275abed280bfb.mp3", "sr": 24000, "start_ms": 0, "end_ms": 500}}, {"id": "u12", "role": "user", "start_time": 116796, "end_time": 120000, "text": "《长相思》啊，听着挺有感觉的，那", "unsaid": "就它了！谢啦，周末见！", "media": {"kind": "audio", "uri": "media/6a/6a183a1e1a2eeadd0e003532f263 <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const EP = DATA.episode, TR = DATA.trace || {units: []};  // the trajectory, and its agent trace (a separate record)
const UNIT = TR.unit_ms || 1000, PX = 0.06;  // px per ms on the strip
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let sel = null;

function render() {
  const units = TR.units || [], dur = EP.meta.duration_ms || 0;
  const decisions = units.map(u => ({listen: '.', speak: 'S', prompt: 'P'}[u.decision] || '?')).join('');
  const width = Math.max(dur, ...units.map(u => u.end_ms || 0)) * PX + 80;
  const bars = role => EP.turns.filter(t => t.role === role && t.end_time > t.start_time).map(t =>
    `<div class="bar ${role}" style="left:${56 + t.start_time * PX}px;width:${(t.end_time - t.start_time) * PX}px" title="${esc(t.start_time + '–' + t.end_time + 'ms  ' + t.text)}">${esc(t.text)}</div>`).join('');
  const cells = units.filter(u => u.unit_index >= 0 && u.end_ms != null).map(u =>
    `<div class="cell ${esc(u.decision)}" data-i="${u.unit_index}" style="left:${56 + (u.end_ms - UNIT) * PX + 1}px;width:${UNIT * PX - 2}px" title="unit ${u.unit_index} · ${u.end_ms - UNIT}–${u.end_ms}ms · ${esc(u.decision)}"></div>`).join('');
  const ticks = [];
  for (let t = 0; t <= dur; t += 5000) ticks.push(`<span style="left:${56 + t * PX}px">${t / 1000}s</span>`);
  $('#main').innerHTML = `
    <h1>${esc(EP.meta.episode_id)} <span class="hint">agent server trace — the agent's own model, for monitoring and debugging (not part of the environment)</span></h1>
    <div class="chips">
      <span class="chip">server <b>${esc(TR.server || '—')}</b></span><span class="chip">model <b>${esc(TR.model || '—')}</b></span>
      <span class="chip">unit <b>${esc(TR.unit_ms ?? '—')} ms</b></span><span class="chip">clock <b>${esc(TR.clock || '—')}</b></span>
      <span class="chip">units <b>${units.length}</b></span><span class="chip" style="font-family:var(--mono)">${esc(decisions)}</span>
    </div>
    <section class="card"><h3>Units on the episode timeline <span class="hint">one cell per model unit (grey listen · orange speak); click to inspect</span></h3>
      <div class="strip"><div style="width:${width}px">
        <div class="lane"><span class="lbl">user</span>${bars('user')}</div>
        <div class="lane"><span class="lbl">agent</span>${bars('agent')}</div>
        <div class="lane"><span class="lbl">units</span>${cells}</div>
        <div class="axis">${ticks.join('')}</div>
      </div></div></section>
    <section class="card"><h3>Tokens per unit <span class="hint">what was appended to the model's context (in) and what it generated (out); special tokens outlined</span><span class="sp"></span>
      <label class="hint"><input type="checkbox" id="collapse" checked> collapse runs</label>
      <label class="hint"><input type="checkbox" id="speakonly"> speak units only</label></h3>
      <div class="tablewrap"><table><thead><tr><th style="text-align:right">unit</th><th>input window</th><th>decision</th><th>tokens</th></tr></thead><tbody id="units"></tbody></table></div></section>`;
  document.querySelectorAll('.cell').forEach(c => c.onclick = () => select(+c.dataset.i, true));
  $('#collapse').onchange = renderTable; $('#speakonly').onchange = renderTable;
  renderTable();
}

function tokSpan(tok, special, n) {
  const [id, text] = tok;
  return `<span class="tok${special ? ' sp' : ''}" title="id ${id}${n > 1 ? ' ×' + n : ''}">${esc(text === '' ? '∅' : text)}${n > 1 ? `<span class="n">×${n}</span>` : ''}</span>`;
}
function toks(list, special, collapse) {
  if (!list || !list.length) return '<span class="hint">—</span>';
  const out = [];
  for (let i = 0; i < list.length;) {
    let j = i + 1;
    if (collapse) while (j < list.length && list[j][0] === list[i][0]) j++;
    out.push(tokSpan(list[i], special.has(list[i][0]), j - i));
    i = j;
  }
  return out.join('');
}
function renderTable() {
  const collapse = $('#collapse').checked, speakOnly = $('#speakonly').checked;
  $('#units').innerHTML = (TR.units || []).filter(u => !speakOnly || u.decision === 'speak').map(u => {
    const special = new Set(u.special_ids || []);
    const win = u.unit_index < 0 ? 'session start' : (u.end_ms != null ? `${u.end_ms - UNIT}–${u.end_ms}ms` : '');
    const stages = (u.stages || []).map(st => `<div><span class="stage">${esc(st.stage)} in (${(st.input || []).length})</span>${toks(st.input, special, collapse)}</div>
      <div><span class="stage">${esc(st.stage)} out (${(st.output || []).length})</span>${toks(st.output, special, collapse)}</div>`).join('');
    return `<tr class="unit" id="u${u.unit_index}" data-i="${u.unit_index}"><td class="num">${u.unit_index}</td><td class="mono">${win}</td>
      <td><span class="dec ${esc(u.decision)}">${esc(u.decision)}</span></td><td class="toks">${stages}</td></tr>`;
  }).join('');
  document.querySelectorAll('tr.unit').forEach(r => r.onclick = () => select(+r.dataset.i, false));
  mark();
}
function select(i, scroll) {
  sel = i; mark();
  try { history.replaceState(null, '', '#unit=' + i); } catch (e) {}
  if (scroll) {
    const row = document.getElementById('u' + i), wrap = $('.tablewrap');
    if (row) { wrap.scrollTop = row.offsetTop - wrap.clientHeight / 3; wrap.scrollIntoView({block: 'nearest'}); }
  }
}
function mark() {
  document.querySelectorAll('[data-i]').forEach(el => el.classList.toggle('sel', +el.dataset.i === sel));
}
render();
const m = /unit=(-?\d+)/.exec(location.hash);
if (m) requestAnimationFrame(() => select(+m[1], true));  // after layout
</script>
